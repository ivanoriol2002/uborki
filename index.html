<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>График уборок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --link: var(--tg-theme-link-color, #2a7ae2);
    --btn: var(--tg-theme-button-color, #2a7ae2);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --green: #2e9d4f; --orange: #e8891c; --red: #d64545;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: var(--bg2); }
  header h1 { margin: 0; font-size: 20px; }
  header button { border: 0; background: none; color: var(--link); font-size: 15px; padding: 6px 0; }
  header .right { display: flex; align-items: center; gap: 12px; }
  #sync { font-size: 13px; color: var(--hint); }
  main { padding: 0 12px 40px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 18px 4px 8px; }
  .card { background: var(--bg); border-radius: 14px; padding: 14px; margin-bottom: 10px;
    border-left: 5px solid var(--green); }
  .card.urgent { border-left-color: var(--red); }
  .card.changed { border-left-color: var(--orange); }
  .card.finished { opacity: .75; }
  .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .apt { font-size: 22px; font-weight: 700; }
  .day { color: var(--hint); }
  .badge { margin-left: auto; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 10px;
    background: #e3f4e1; color: #1f6b35; }
  .urgent .badge { background: #fde2e2; color: #9b2c2c; }
  .changed .badge { background: #fde5c8; color: #8a4b08; }
  .ivan { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: #fff4e5; color: #6b3d00; }
  .guest { margin-top: 10px; }
  .guest .lbl { font-size: 12px; color: var(--hint); }
  .guest .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .guest a { color: var(--link); text-decoration: none; white-space: nowrap; }
  .steps { margin-top: 12px; border-top: 1px solid var(--bg2); padding-top: 4px; }
  .step { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--bg2); }
  .step:last-child { border-bottom: 0; }
  .num { flex: 0 0 24px; height: 24px; border-radius: 12px; background: var(--bg2); color: var(--hint);
    font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .num.ok { background: var(--green); color: #fff; }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 600; }
  .muted { color: var(--hint); font-size: 13px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; -webkit-overflow-scrolling: touch; }
  .chip { flex: 0 0 auto; border: 1px solid var(--bg2); background: var(--bg2); color: var(--text);
    border-radius: 16px; padding: 6px 11px; font-size: 14px; }
  .chip.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .btn { display: block; width: 100%; margin-top: 8px; border: 0; border-radius: 10px; padding: 11px;
    font-size: 15px; font-weight: 600; background: var(--btn); color: var(--btn-text); }
  .btn.sec { background: var(--bg2); color: var(--text); }
  .btn:disabled { opacity: .45; }
  .link { border: 0; background: none; color: var(--link); padding: 4px 0; font-size: 14px; }
  .inline { display: flex; gap: 6px; margin-top: 8px; }
  input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg2); border: 0;
    border-radius: 10px; padding: 10px; }
  textarea { min-height: 64px; resize: vertical; }
  .inline .btn { width: auto; margin: 0; padding: 0 14px; }
  .buy { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; gap: 8px; }
  .buy .x { border: 0; background: none; color: var(--red); font-size: 18px; padding: 0 4px; }
  .form { margin-top: 8px; display: grid; gap: 8px; }
  .file { font-size: 14px; }
  details summary { color: var(--hint); margin: 18px 4px 8px; font-size: 13px; text-transform: uppercase; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: 16px; padding: 12px 14px; border-radius: 12px;
    background: #222; color: #fff; font-size: 14px; display: none; z-index: 10; }
  #toast.err { background: var(--red); }
  .empty { text-align: center; color: var(--hint); padding: 40px 0; }
</style>
</head>
<body>
<header><h1>Уборки</h1><div class="right"><span id="sync"></span><button id="refresh">Обновить</button></div></header>
<main id="list"><p class="empty">Загрузка…</p></main>
<div id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const API = new URLSearchParams(location.search).get('api');
let state = null;           // данные с сервера
const ui = { open: {} };    // какие формы раскрыты: { 'buy|key': true, 'custom|key': true }

if (tg) { tg.ready(); tg.expand(); }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = isErr ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, isErr ? 5000 : 2200);
}
function haptic(kind) { try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }
function confirmBox(text) {
  return new Promise(res => {
    if (tg && tg.showConfirm) { try { tg.showConfirm(text, ok => res(!!ok)); return; } catch (e) {} }
    res(window.confirm(text));
  });
}

async function call(action, extra) {
  if (!API) throw new Error('Откройте график через бота в Telegram');
  const body = Object.assign({ action: action, initData: tg ? tg.initData : '' }, extra || {});
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Ошибка');
  return j.data;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
/** Если таблица занята обновлением, сервер ничего не сохранил — можно спокойно повторить. */
async function withRetry(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      if (i < 4 && /обновляется/i.test(e.message)) { setSync('Таблица обновляется, жду…'); await sleep(8000); continue; }
      throw e;
    }
  }
}

function setSync(text) { document.getElementById('sync').textContent = text || ''; }
function nowShort() {
  const d = new Date(), p = n => ('0' + n).slice(-2);
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function findItem(key) { return state && state.items.find(i => i.key === key); }

// Кнопки срабатывают сразу: карточка меняется на экране, запрос уходит в фоне, по очереди.
const pending = {};      // сколько запросов в пути по каждой уборке
let inflight = 0;
let chain = Promise.resolve();
let savedTimer = null;

function send(action, extra, key, okMsg) {
  inflight++;
  if (key) pending[key] = (pending[key] || 0) + 1;
  setSync('Сохраняю…');
  render();
  const p = chain.then(() => withRetry(() => call(action, extra))).then(data => {
    inflight--; if (key) pending[key]--;
    if (data.items) { if (!inflight) state = data; }
    else if (data.item && !pending[data.item.key]) {
      const i = state.items.findIndex(x => x.key === data.item.key);
      if (i >= 0) state.items[i] = data.item;
    }
    render();
    if (!inflight) {
      setSync('Сохранено ✓');
      clearTimeout(savedTimer); savedTimer = setTimeout(() => { if (!inflight) setSync(''); }, 2000);
    }
    if (okMsg) toast(okMsg);
    return data;
  }, err => {
    inflight--; if (key) pending[key]--;
    setSync('');
    toast('Не сохранилось: ' + err.message, true); haptic('error');
    reload(); // вернуть экран к тому, что реально в таблице
    throw err;
  });
  chain = p.catch(() => {});
  return p.catch(() => null); // null = не сохранилось (ошибка уже показана)
}

let loading = false;
async function reload() {
  if (loading) return;
  loading = true;
  if (!inflight) setSync('Загрузка…');
  try {
    const data = await withRetry(() => call('list'));
    if (!inflight) { state = data; render(); setSync(''); }
  } catch (e) {
    setSync(''); toast(e.message, true);
    if (!state) document.getElementById('list').innerHTML = '<p class="empty">' + esc(e.message) + '</p>';
  } finally { loading = false; }
}

function phoneLink(p) {
  if (!p) return '';
  const tel = String(p).replace(/[^\d+]/g, '');
  return '<a href="tel:' + esc(tel) + '">📞 ' + esc(p) + '</a>';
}
function guestsWord(n) {
  n = Number(n); if (!n) return '';
  const m10 = n % 10, m100 = n % 100;
  const w = m10 === 1 && m100 !== 11 ? 'гость' : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? 'гостя' : 'гостей';
  return n + ' ' + w;
}
function money(n) { return String(Math.round(Number(n) * 100) / 100).replace('.', ','); }

function card(it) {
  const k = esc(it.key);
  const cls = ['card', it.changed ? 'changed' : it.urgent ? 'urgent' : '', it.done ? 'finished' : ''].join(' ');
  const badge = it.urgent ? 'Заезд в ' + esc(state.checkin) : 'Заезда нет';
  let h = '<div class="' + cls + '">';
  h += '<div class="top"><span class="apt">' + esc(it.apartment) + '</span><span class="day">' + esc(it.day) +
    '</span><span class="badge">' + badge + '</span></div>';
  if (it.fromIvan) h += '<div class="ivan">От Ивана: ' + esc(it.fromIvan) + '</div>';

  // гости
  h += '<div class="guest"><div class="lbl">Выезжает до ' + esc(state.checkout) + '</div><div class="row"><span>' +
    esc(it.out.name || 'гость') + (it.out.guests ? ' · ' + guestsWord(it.out.guests) : '') + '</span>' +
    phoneLink(it.out.phone) + '</div></div>';
  if (it.urgent) {
    h += '<div class="guest"><div class="lbl">Заезжает в ' + esc(state.checkin) + '</div><div class="row"><span>' +
      esc(it.next.name || 'гость') + (it.next.guests ? ' · ' + guestsWord(it.next.guests) : '') + '</span>' +
      phoneLink(it.next.phone) + '</div></div>';
  } else {
    h += '<div class="guest muted">Сегодня никто не заезжает' +
      (it.next.guests ? ' · следующие: ' + guestsWord(it.next.guests) : '') + '</div>';
  }

  h += '<div class="steps">';
  // 1. время
  const times = state.times || [];
  h += '<div class="step"><div class="num ' + (it.maidTime ? 'ok' : '') + '">1</div><div class="body">' +
    '<div class="title">Буду в квартире' + (it.maidTime ? ': ' + esc(it.maidTime) : '') + '</div>';
  if (!it.done) {
    h += '<div class="chips">' + times.map(t => '<button class="chip' + (t === it.maidTime ? ' on' : '') +
      '" data-act="time" data-key="' + k + '" data-time="' + t + '">' + t + '</button>').join('') +
      '<button class="chip" data-act="custom" data-key="' + k + '">своё…</button></div>';
    if (ui.open['custom|' + it.key]) {
      h += '<div class="inline"><input id="ct-' + k + '" placeholder="например 12:15–14:00" value="' +
        esc(times.indexOf(it.maidTime) < 0 ? it.maidTime : '') + '"><button class="btn" data-act="timeCustom" data-key="' +
        k + '">OK</button></div>';
    }
  }
  h += '</div></div>';

  // 2. убрано
  h += '<div class="step"><div class="num ' + (it.cleaned ? 'ok' : '') + '">2</div><div class="body">';
  if (it.cleaned) {
    h += '<div class="title">Убрано ✓ <span class="muted">' + esc(it.cleaned.slice(-5)) + '</span></div>';
    if (!it.done) h += '<button class="link" data-act="undo" data-field="cleaned" data-key="' + k + '">отменить</button>';
  } else {
    h += '<div class="title">Уборка</div><button class="btn" data-act="cleaned" data-key="' + k + '">🧹 Убрано</button>';
  }
  h += '</div></div>';

  // 3. видео
  h += '<div class="step"><div class="num ' + (it.video ? 'ok' : '') + '">3</div><div class="body">';
  if (it.video) {
    h += '<div class="title">Видео-обзор получено ✓' + (it.video > 1 ? ' (' + it.video + ')' : '') + '</div>';
    if (!it.done) h += '<button class="link" data-act="video" data-key="' + k + '">отправить ещё</button>';
  } else if (it.cleaned) {
    h += '<div class="title">Видео-обзор</div><div class="muted">Снимите квартиру и отправьте видео в чат бота. ' +
      'Через минуту нажмите «Обновить».</div>' +
      '<button class="btn" data-act="video" data-key="' + k + '">🎥 Отправить видео в чат</button>';
  } else {
    h += '<div class="title">Видео-обзор</div><div class="muted">После «Убрано»</div>';
  }
  h += '</div></div>';

  // 4. готово
  h += '<div class="step"><div class="num ' + (it.done ? 'ok' : '') + '">4</div><div class="body">';
  if (it.done) {
    h += '<div class="title">Готово ✓ <span class="muted">' + esc(it.done.slice(-5)) + '</span></div>' +
      '<button class="link" data-act="undo" data-field="done" data-key="' + k + '">отменить</button>';
  } else {
    h += '<button class="btn" data-act="done" data-key="' + k + '"' + (it.video ? '' : ' disabled') + '>✅ Готово</button>';
  }
  h += '</div></div>';

  // покупки
  const sum = it.purchases.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  h += '<div class="step"><div class="num">₽</div><div class="body"><div class="title">Покупки' +
    (sum ? ': ' + money(sum) + ' BYN' : '') + '</div>';
  it.purchases.forEach(p => {
    h += '<div class="buy"><span>' + money(p.amount) + ' BYN' + (p.what ? ' — ' + esc(p.what) : '') +
      (p.receipt ? ' 🧾' : ' <span class="muted">без чека</span>') + '</span>' +
      (p.saving ? '<span class="muted">сохраняю…</span>' :
        '<button class="x" data-act="delBuy" data-key="' + k + '" data-id="' + esc(p.id) + '">✕</button>') + '</div>';
  });
  if (ui.open['buy|' + it.key]) {
    h += '<div class="form"><input id="ba-' + k + '" inputmode="decimal" placeholder="Сумма, BYN">' +
      '<input id="bw-' + k + '" placeholder="Что купили">' +
      '<label class="file">Фото чека: <input id="bf-' + k + '" type="file" accept="image/*"></label>' +
      '<button class="btn" data-act="buySave" data-key="' + k + '">Сохранить покупку</button>' +
      '<button class="btn sec" data-act="buyToggle" data-key="' + k + '">Отмена</button></div>';
  } else {
    h += '<button class="link" data-act="buyToggle" data-key="' + k + '">+ Покупка</button>';
  }
  h += '</div></div>';

  // комментарий
  h += '<div class="step"><div class="num">✎</div><div class="body"><div class="title">Комментарий</div>' +
    '<textarea id="cm-' + k + '" placeholder="Что закончилось, сломалось, что заметили">' + esc(it.comment) + '</textarea>' +
    '<button class="btn sec" data-act="comment" data-key="' + k + '">Сохранить комментарий</button></div></div>';

  h += '</div></div>';
  return h;
}

function render() {
  const list = document.getElementById('list');
  if (!state || !state.items.length) { list.innerHTML = '<p class="empty">В ближайшие дни уборок нет</p>'; return; }
  const today = state.today;
  const tomorrow = new Date(today + 'T12:00:00Z'); tomorrow.setUTCDate(tomorrow.getUTCDate() + 1);
  const tmr = tomorrow.toISOString().slice(0, 10);
  const past = state.items.filter(i => i.date < today);
  const future = state.items.filter(i => i.date >= today);
  let h = '', lastDate = '';
  future.forEach(it => {
    if (it.date !== lastDate) {
      lastDate = it.date;
      const name = it.date === today ? 'Сегодня, ' + it.day : it.date === tmr ? 'Завтра, ' + it.day : it.day;
      h += '<h2>' + esc(name) + '</h2>';
    }
    h += card(it);
  });
  if (!future.length) h += '<p class="empty">Впереди уборок нет</p>';
  if (past.length) {
    h += '<details' + (ui.pastOpen ? ' open' : '') + ' id="past"><summary>Прошедшие (' + past.length + ')</summary>' +
      past.slice().reverse().map(card).join('') + '</details>';
  }
  // не теряем то, что горничная печатает или выбрала, пока приходят ответы сервера
  const typed = {}, files = {};
  list.querySelectorAll('input:not([type=file]), textarea').forEach(el => { if (el.dataset.dirty) typed[el.id] = el.value; });
  list.querySelectorAll('input[type=file]').forEach(el => { files[el.id] = el; });
  const focusId = document.activeElement && document.activeElement.id;
  list.innerHTML = h;
  Object.keys(typed).forEach(id => { const el = document.getElementById(id); if (el) { el.value = typed[id]; el.dataset.dirty = '1'; } });
  Object.keys(files).forEach(id => { const el = document.getElementById(id); if (el) el.replaceWith(files[id]); });
  if (focusId) { const el = document.getElementById(focusId); if (el && el.focus) el.focus(); }
  const d = document.getElementById('past');
  if (d) d.addEventListener('toggle', () => { ui.pastOpen = d.open; });
}

/** Сжимаем фото чека до ~1600 px, чтобы быстро загружалось. */
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.75).split(',')[1]);
    };
    img.onerror = () => reject(new Error('Не удалось открыть фото'));
    img.src = URL.createObjectURL(file);
  });
}

document.getElementById('list').addEventListener('input', e => { e.target.dataset.dirty = '1'; });

document.getElementById('list').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const key = b.dataset.key, a = b.dataset.act, it = findItem(key);
  const field = id => document.getElementById(id + '-' + key);
  const val = id => { const el = field(id); return el ? el.value.trim() : ''; };
  const ok = () => haptic('success');

  if (a === 'time') { it.maidTime = b.dataset.time; ok(); return send('time', { key: key, time: it.maidTime }, key); }
  if (a === 'custom') { ui.open['custom|' + key] = !ui.open['custom|' + key]; return render(); }
  if (a === 'timeCustom') {
    ui.open['custom|' + key] = false; it.maidTime = val('ct'); ok();
    return send('time', { key: key, time: it.maidTime }, key);
  }
  if (a === 'cleaned') {
    if (!(await confirmBox('Квартира убрана?'))) return;
    it.cleaned = nowShort(); ok();
    return send('cleaned', { key: key }, key);
  }
  if (a === 'video') {
    // тут ждём ответ: бот должен знать, к какой уборке придёт видео, до того как приложение закроется
    toast('Секунду…');
    if (!(await send('video', { key: key }, key))) return;
    toast('Отправьте видео в чат бота');
    setTimeout(() => { if (tg) tg.close(); }, 700);
    return;
  }
  if (a === 'done') {
    if (!(await confirmBox('Всё готово, можно отправить отчёт?'))) return;
    it.done = nowShort(); ok();
    return send('done', { key: key }, key, 'Готово! Спасибо');
  }
  if (a === 'undo') {
    if (!(await confirmBox('Отменить отметку?'))) return;
    if (b.dataset.field === 'done') it.done = ''; else { it.cleaned = ''; it.done = ''; }
    return send('undo', { key: key, field: b.dataset.field }, key);
  }
  if (a === 'comment') {
    const el = field('cm'); if (el) delete el.dataset.dirty;
    it.comment = val('cm'); ok();
    return send('comment', { key: key, text: it.comment }, key, 'Комментарий сохранён');
  }
  if (a === 'buyToggle') { ui.open['buy|' + key] = !ui.open['buy|' + key]; return render(); }
  if (a === 'buySave') {
    const amount = val('ba').replace(',', '.');
    if (!(Number(amount) > 0)) return toast('Укажите сумму в BYN, например 12,50', true);
    const fileEl = field('bf');
    const file = fileEl && fileEl.files && fileEl.files[0];
    if (!file && !(await confirmBox('Сохранить без фото чека?'))) return;
    const what = val('bw');
    ui.open['buy|' + key] = false;
    it.purchases.push({ id: 'tmp' + Date.now(), amount: Number(amount), what: what, receipt: !!file, saving: true });
    ok(); render();
    let photo = '';
    try { if (file) photo = await compress(file); }
    catch (err) { it.purchases = it.purchases.filter(p => !p.saving); render(); return toast(err.message, true); }
    return send('purchase', { key: key, amount: amount, what: what, photo: photo }, key);
  }
  if (a === 'delBuy') {
    if (!(await confirmBox('Удалить эту покупку?'))) return;
    it.purchases = it.purchases.filter(p => p.id !== b.dataset.id); ok();
    return send('delPurchase', { id: b.dataset.id }, key);
  }
});

document.getElementById('refresh').addEventListener('click', () => { if (!inflight) reload(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && state && !inflight) reload(); });

reload();
</script>
</body>
