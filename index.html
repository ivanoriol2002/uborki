<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Квартиры</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<style>
  /* своя палитра: светлая и тёмная (тема берётся из Telegram) */
  :root {
    color-scheme: light;
    --page: #f2f3f7; --bg: #ffffff; --bg2: #f0f1f5; --line: #e9eaef;
    --text: #16181d; --hint: #868a94; --link: #2f6fe4;
    --btn: #3b82f6; --btn-text: #ffffff;
    --green: #2ea05a; --orange: #e8891c; --red: #e05252; --grey: #b4b8c0; --blue: #3b82f6;
    --ok-bg: #e6f5ea; --ok-fg: #1f6b35; --info-bg: #e4edfd; --info-fg: #1d4f9a;
    --chg-bg: #fdeed9; --chg-fg: #8a4b08; --bad-bg: #fde6e6; --bad-fg: #a12f2f; --toast: #23252b;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #121318; --bg: #1d1f26; --bg2: #2a2d35; --line: #2a2d34;
    --text: #eceef3; --hint: #8f95a1; --link: #7aa7ff;
    --btn: #4a8cff; --btn-text: #ffffff;
    --green: #3fbf6f; --orange: #f0a04b; --red: #f06b6b; --grey: #5b606b; --blue: #4a8cff;
    --ok-bg: rgba(63,191,111,.16); --ok-fg: #86dba3; --info-bg: rgba(74,140,255,.18); --info-fg: #a9c6ff;
    --chg-bg: rgba(240,160,75,.17); --chg-fg: #f5c28a; --bad-bg: rgba(240,107,107,.17); --bad-fg: #ffadad; --toast: #34373f;
  }
  a { color: var(--link); text-decoration: none; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: var(--page); }
  header h1 { margin: 0; font-size: 20px; }
  header .right { display: flex; align-items: center; gap: 12px; }
  header button { border: 0; background: none; color: var(--link); font-size: 15px; padding: 6px 0; }
  #sync { font-size: 13px; color: var(--hint); }
  main { padding: 0 12px 40px; }
  .box { background: var(--bg); border-radius: 14px; padding: 12px; margin-bottom: 10px; }

  /* календарь */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-head b { font-size: 16px; }
  .cal-head button { border: 0; background: var(--bg2); color: var(--text); width: 36px; height: 32px;
    border-radius: 8px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .wd { font-size: 11px; color: var(--hint); padding: 2px 0; }
  .d { border: 0; background: none; color: var(--text); border-radius: 10px; padding: 5px 0 4px; min-height: 46px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 15px; }
  .d.past { color: var(--hint); }
  .d.today .n { border: 2px solid var(--btn); }
  .d.sel { background: var(--btn); color: var(--btn-text); }
  .d.sel .n { border-color: var(--btn-text); }
  .n { width: 26px; height: 26px; line-height: 22px; border-radius: 13px; border: 2px solid transparent; }
  .dots { display: flex; gap: 2px; height: 6px; align-items: center; }
  .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--green); }
  .dot.urgent { background: var(--blue); } .dot.changed { background: var(--orange); } .dot.done { background: var(--grey); }
  .bell { font-size: 8px; line-height: 6px; }
  .d.sel .dot { box-shadow: 0 0 0 1.5px var(--btn-text); }
  .d.na { color: var(--hint); opacity: .4; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--hint); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 16px 4px 8px; }
  .card { background: var(--bg); border-radius: 14px; padding: 14px; margin-bottom: 10px;
    border-left: 5px solid var(--green); }
  .card.urgent { border-left-color: var(--blue); }
  .card.changed { border-left-color: var(--orange); }
  .card.finished { opacity: .75; }
  .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .apt { font-size: 22px; font-weight: 700; }
  .badge { margin-left: auto; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 10px;
    background: var(--ok-bg); color: var(--ok-fg); }
  .urgent .badge { background: var(--info-bg); color: var(--info-fg); }
  .changed .badge { background: var(--chg-bg); color: var(--chg-fg); }
  .times { display: flex; gap: 16px; margin-top: 8px; font-size: 14px; }
  .times b { font-size: 16px; }
  .ivan { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: var(--chg-bg); color: var(--chg-fg); }
  .guest { margin-top: 10px; }
  .guest .lbl { font-size: 12px; color: var(--hint); }
  .guest .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .guest a { color: var(--link); text-decoration: none; white-space: nowrap; }
  .steps { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 4px; }
  .step { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .step:last-child { border-bottom: 0; }
  .num { flex: 0 0 24px; height: 24px; border-radius: 12px; background: var(--bg2); color: var(--hint);
    font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .num.ok { background: var(--green); color: #fff; }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 600; }
  .muted { color: var(--hint); font-size: 13px; }
  .warn { margin-top: 6px; padding: 6px 8px; border-radius: 8px; background: var(--bad-bg); color: var(--bad-fg); font-size: 13px; }
  .note { margin-top: 6px; font-size: 13px; color: var(--chg-fg); }
  .btn { display: block; width: 100%; margin-top: 8px; border: 0; border-radius: 10px; padding: 11px;
    font-size: 15px; font-weight: 600; background: var(--btn); color: var(--btn-text); }
  .btn.sec { background: var(--bg2); color: var(--text); }
  .btn:disabled { opacity: .4; }
  .link { border: 0; background: none; color: var(--link); padding: 4px 0; font-size: 14px; }
  .inline { display: flex; gap: 6px; margin-top: 8px; align-items: stretch; }
  .inline .btn { width: auto; margin: 0; padding: 0 14px; }
  input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg2); border: 0;
    border-radius: 10px; padding: 10px; }
  input[type=time], input[type=date] { min-height: 42px; -webkit-appearance: none; appearance: none; min-width: 0;
    display: block; text-align: left; }
  input[type=time]::-webkit-date-and-time-value, input[type=date]::-webkit-date-and-time-value { text-align: left; }
  input::placeholder, textarea::placeholder { color: var(--hint); }
  .inline input[type=time] { flex: 0 0 120px; width: 120px; }
  .inline label input[type=time] { width: 100%; flex: none; }
  /* время всегда в 24-часовом формате: поле iOS прозрачное, поверх — наш текст; колесо выбора стандартное */
  .t24 { position: relative; display: block; min-width: 0; margin-top: 3px; }
  .inline > .t24 { flex: 0 0 120px; margin-top: 0; }
  .t24 input[type=time] { width: 100%; margin: 0; color: transparent; -webkit-text-fill-color: transparent; }
  .t24 input[type=time]::-webkit-datetime-edit { color: transparent; }
  .t24 b { position: absolute; left: 12px; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none;
    font-weight: 500; color: var(--text); white-space: nowrap; }
  .t24 b.empty { color: var(--hint); font-weight: 400; }
  .t24.big b { font-size: 20px; font-weight: 600; text-align: center; }
  textarea { min-height: 64px; resize: vertical; }
  .buy, .rem { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; gap: 8px; }
  .x { border: 0; background: none; color: var(--red); font-size: 18px; padding: 0 4px; }
  .form { margin-top: 8px; display: grid; gap: 8px; }
  .file { font-size: 14px; }
  .empty { text-align: center; color: var(--hint); padding: 16px 0; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: 16px; padding: 12px 14px; border-radius: 12px;
    background: var(--toast); color: #fff; font-size: 14px; display: none; z-index: 10; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  #toast.err { background: var(--red); }

  /* режим Ивана */
  /* нижняя безопасная зона: от iOS (env) или от Telegram (--tg-safe-area-inset-bottom), не меньше 14px */
  :root { --safe-b: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px), 14px); }
  body.owner main { padding-bottom: calc(96px + var(--safe-b)); }
  body.owner #toast { bottom: calc(84px + var(--safe-b)); }
  /* меню — плавающая панель с отступами, чтобы не уходить в скруглённые углы экрана */
  #tabs { display: none; position: fixed; left: 12px; right: 12px; bottom: var(--safe-b); z-index: 6;
    background: var(--bg); border: 1px solid var(--line); border-radius: 22px; padding: 6px 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  body.owner #tabs { display: flex; }
  #tabs button { flex: 1; border: 0; background: none; color: var(--hint); font-size: 11px; padding: 4px 0;
    display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #tabs button.on { color: var(--btn); font-weight: 600; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .seg button { border: 0; background: var(--bg); color: var(--text); border-radius: 16px; padding: 6px 12px; font-size: 14px; }
  .seg button.on { background: var(--btn); color: var(--btn-text); }
  .kv { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }
  .kv .muted { font-size: 14px; }
  .chip-s { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--bg2); }
  .st-ok { background: var(--ok-bg); color: var(--ok-fg); } .st-warn { background: var(--chg-bg); color: var(--chg-fg); }
  .st-off { background: var(--bg2); color: var(--hint); } .st-bad { background: var(--bad-bg); color: var(--bad-fg); }
  .bk { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .bk:last-child { border-bottom: 0; }
  .bk .r1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bk .r2, .bk .r3 { font-size: 14px; margin-top: 2px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .big { font-size: 30px; font-weight: 700; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0; }
  .nums div { background: var(--bg2); border-radius: 10px; padding: 8px; }
  .nums b { display: block; font-size: 16px; }
  .nums small { color: var(--hint); font-size: 12px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
  table.t td, table.t th { padding: 5px 4px; text-align: right; border-top: 1px solid var(--line); }
  table.t td:first-child, table.t th:first-child { text-align: left; }
  table.t th { color: var(--hint); font-weight: 500; font-size: 12px; }
  .stat { font-size: 14px; margin-top: 4px; }
  .rcpt { border: 0; background: var(--bg2); color: var(--link); border-radius: 8px; padding: 4px 8px; font-size: 13px; margin: 4px 4px 0 0; }
  select { width: 100%; font: inherit; color: var(--text); background: var(--bg2); border: 0; border-radius: 10px; padding: 10px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .grid2 > * { min-width: 0; }
  label.f { font-size: 12px; color: var(--hint); display: block; min-width: 0; }
  details summary { cursor: pointer; }
  label.f input, label.f select, label.f textarea { margin-top: 3px; }

  /* ================= Liquid Glass (Apple) =================
     Стекло — только функциональный слой: нижнее меню, шапка при прокрутке, всплывающие сообщения.
     Карточки и списки — плотные, чтобы текст читался. Под стеклом — мягкий цветной фон. */
  :root {
    --radius: 22px;
    --glass-fill: rgba(255,255,255,.7); --glass-border: rgba(255,255,255,.75); --glass-hi: rgba(255,255,255,.9);
    --glass-shade: rgba(0,0,0,.06); --glass-shadow: 0 8px 30px rgba(20,30,60,.12);
    --glass-blur: blur(28px) saturate(1.6);
    --card-shadow: 0 1px 2px rgba(20,30,60,.04), 0 6px 18px rgba(20,30,60,.06);
    --accent-soft: rgba(59,130,246,.14);
    --orb1: rgba(59,130,246,.20); --orb2: rgba(46,160,90,.14); --orb3: rgba(232,137,28,.10);
  }
  :root[data-theme="dark"] {
    --glass-fill: rgba(30,32,40,.74); --glass-border: rgba(255,255,255,.14); --glass-hi: rgba(255,255,255,.22);
    --glass-shade: rgba(0,0,0,.35); --glass-shadow: 0 10px 36px rgba(0,0,0,.55);
    --card-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    --accent-soft: rgba(74,140,255,.18);
    --orb1: rgba(74,140,255,.18); --orb2: rgba(63,191,111,.10); --orb3: rgba(240,160,75,.07);
  }
  body { font-size: 16px; -webkit-font-smoothing: antialiased; }
  #bgfx { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(70% 45% at 0% 25%, var(--orb1), transparent 70%),
                radial-gradient(60% 40% at 100% 55%, var(--orb2), transparent 70%),
                radial-gradient(70% 45% at 30% 100%, var(--orb3), transparent 70%); }

  .glass, #tabs, #toast, header.scrolled {
    background: var(--glass-fill);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  }
  #tabs, #toast { isolation: isolate; border: .5px solid var(--glass-border);
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-shade); }
  /* блик по краю стекла */
  #tabs::before, #toast::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(135deg, var(--glass-hi), transparent 40%, transparent 65%, var(--glass-border));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }

  /* шапка: прозрачная, при прокрутке — стекло */
  header { background: transparent; padding-top: calc(10px + var(--tg-content-safe-area-inset-top, 0px));
    transition: background .25s, box-shadow .25s; }
  header.scrolled { box-shadow: 0 .5px 0 var(--glass-border); }
  header h1 { font-size: 28px; letter-spacing: -.02em; }
  header button { font-size: 16px; min-height: 44px; }

  /* нижнее меню — стеклянная капсула */
  #tabs { left: 12px; right: 12px; bottom: var(--safe-b); border-radius: 28px; padding: 6px; }
  #tabs button { min-height: 48px; border-radius: 22px; gap: 1px; transition: transform .15s, background .2s; }
  #tabs button.on { color: var(--btn); background: var(--accent-soft); }

  /* сообщения — стекло, текст цвета темы */
  #toast { color: var(--text); border-radius: 18px; padding: 14px 16px; font-weight: 500; }
  #toast.err { background: var(--glass-fill); color: var(--red); }

  /* контент — плотные карточки */
  .box, .card { border-radius: var(--radius); box-shadow: var(--card-shadow); }
  .box { padding: 16px; margin-bottom: 12px; }
  .card { padding: 16px 16px 16px 20px; margin-bottom: 12px; border-left: 0; position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px;
    border-radius: 0 4px 4px 0; background: var(--green); }
  .card.urgent::before { background: var(--blue); }
  .card.changed::before { background: var(--orange); }
  .apt { font-size: 26px; letter-spacing: -.02em; }
  .badge, .chip-s { border-radius: 999px; padding: 4px 10px; }
  .ivan, .warn { border-radius: 12px; padding: 10px 12px; }
  h2 { margin: 20px 6px 10px; }

  /* календарь */
  .cal-head b { font-size: 18px; }
  .cal-head button { width: 44px; height: 36px; border-radius: 12px; }
  .d { min-height: 50px; border-radius: 14px; transition: transform .15s; }
  .d.sel { box-shadow: 0 6px 16px rgba(59,130,246,.35); }

  /* кнопки и поля: 44px+, нажатие — лёгкое сжатие */
  .btn { min-height: 50px; border-radius: 14px; font-size: 16px; transition: transform .15s, opacity .15s; }
  .inline .btn { min-height: 44px; }
  .btn.sec { background: var(--bg2); }
  .btn:active, .seg button:active, .d:active, #tabs button:active, .rcpt:active, .cal-head button:active { transform: scale(.97); }
  .btn:active { opacity: .9; }
  input, textarea, select { border-radius: 12px; padding: 12px; min-height: 44px; }
  .seg button { min-height: 38px; padding: 8px 14px; border-radius: 999px; background: var(--bg); box-shadow: var(--card-shadow); }
  .nums div, .rcpt { border-radius: 12px; }
  .num { flex-basis: 26px; height: 26px; border-radius: 13px; }

  /* что закончилось — чипы-галочки */
  .chips { display: flex; gap: 6px; padding: 8px 0 4px; }
  .chips.wrap { flex-wrap: wrap; overflow: visible; }
  .chip { border: 0; background: var(--bg2); color: var(--text); border-radius: 999px; padding: 8px 12px;
    font: inherit; font-size: 14px; min-height: 36px; transition: transform .15s, background .2s; }
  .chip:active { transform: scale(.96); }
  .chip.on { background: var(--btn); color: var(--btn-text); font-weight: 600; }
  .chip small { font-weight: 400; opacity: .75; }
  .tc-label { font-size: 13px; color: var(--hint); margin-top: 10px; }
  .tc-preview { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--bg2); font-size: 14px; }
  /* выбор фото: аккуратная кнопка вместо стандартной «Choose File» */
  .file { display: block; font-size: 13px; color: var(--hint); }
  .file input[type=file] { display: block; width: 100%; margin-top: 4px; padding: 8px; font-size: 14px; color: var(--hint);
    background: var(--bg2); border-radius: 12px; min-height: 44px; }
  .file input[type=file]::file-selector-button, .file input[type=file]::-webkit-file-upload-button {
    border: 0; border-radius: 10px; padding: 8px 12px; margin-right: 10px; font: inherit; font-weight: 600;
    background: var(--accent-soft); color: var(--btn); }
  .prob { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--bad-bg); color: var(--bad-fg); font-size: 14px; }
  /* открыта клавиатура — нижнее меню прячем, чтобы не висело над ней */
  body.kb #tabs { display: none !important; }
  body.kb.owner main { padding-bottom: 24px; }

  /* график с прошлого открытия, пока грузятся свежие данные: кнопки действий приглушены */
  body.stale .card .btn, body.stale .card .chip, body.stale .card .link, body.stale .box .btn { opacity: .5; }

  /* загрузка: скелет вместо пустого экрана */
  .skel { display: grid; gap: 10px; }
  .skel i { display: block; height: 14px; border-radius: 8px; background: var(--bg2); }
  .skel i:nth-child(1) { width: 40%; height: 22px; } .skel i:nth-child(3) { width: 70%; } .skel i:nth-child(4) { width: 55%; }
  @keyframes pulse { 50% { opacity: .45; } }
  .skel i { animation: pulse 1.2s ease-in-out infinite; }

  /* заработок горничной: полоски по месяцам */
  .bars { display: grid; gap: 8px; margin-top: 10px; }
  .bar-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
  .bar { height: 10px; border-radius: 999px; background: var(--bg2); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: var(--btn); }
  .guide li { margin: 6px 0; }
  /* текущий месяц в «Доходах» — выделен */
  .box.cur { border: 1.5px solid var(--btn); box-shadow: 0 8px 24px rgba(59,130,246,.18); }
  .box.cur .kv b { font-size: 20px; }
  .box.cur .nums div { background: var(--accent-soft); }
  .cur-chip { display: inline-block; margin-bottom: 6px; background: var(--accent-soft); color: var(--btn); font-weight: 600; }

  /* без размытия или при повышенном контрасте — плотная заливка */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    #tabs, #toast, header.scrolled { background: var(--bg); }
  }
  @media (prefers-contrast: more) {
    #tabs, #toast, header.scrolled { background: var(--bg); border-color: var(--hint); }
  }

// шапка становится стеклом, когда под ней прокручивается контент

/* ---------- связь с сервером ---------- */
async function call(action, extra) {
  if (!API) throw new Error('Откройте приложение через бота в Telegram');
  const body = Object.assign({ action: action, initData: (tg && tg.initData) || INIT.data }, extra || {});
  const ms = action === 'sync' || action === 'maidSync' ? 120000 : 30000;
  const ctl = window.AbortController ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), ms) : null;
  let res;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined });
  } catch (e) {
    const err = new Error('Нет сети'); err.offline = true; throw err; // нет интернета или ответ не дождались
  } finally { if (timer) clearTimeout(timer); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Сервер не ответил, попробуйте ещё раз'); }
  if (!j.ok) throw new Error(j.error || 'Ошибка');
  if (j.data && j.data.ver) ui.ver = j.data.ver; // «версия» данных на сервере — для тихой проверки раз в минуту
  return j.data;
}

/* ---------- хранение на телефоне ----------
   Только для этого человека (по его Telegram ID). График — не старше 2 дней, черновики — 3 дня.
   Если Иван уберёт доступ, при следующем открытии всё стирается. */
const STORE = {
  p: '',
  get(k) { if (!this.p) return null; try { const v = localStorage.getItem(this.p + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { if (!this.p) return false; try { localStorage.setItem(this.p + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { if (!this.p) return; try { localStorage.removeItem(this.p + k); } catch (e) {} },
  wipe() {
    if (!this.p) return;
    try { Object.keys(localStorage).filter(k => k.indexOf(this.p) === 0).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    this.p = ''; // больше ничего не записываем
  },
};
const SNAP_DAYS = 2, DRAFT_DAYS = 3;
// действия, которые без сети ждут в очереди на телефоне и уходят, когда сеть появится
const QUEUEABLE = ['time', 'start', 'done', 'undo', 'comment', 'purchase', 'delPurchase', 'problem', 'orderSet'];
// кнопки, которые меняют данные: пока на экране данные с прошлого открытия, они ждут свежих
const MUTATING = ['time', 'start', 'video', 'done', 'undo', 'noteSave', 'buySave', 'delBuy', 'probSend', 'ordTap', 'ordSet', 'ordAdd', 'ordBulk',
  'ownerSave', 'ownVideo', 'bkAdd', 'bkSave', 'bkCancel', 'bkRestore', 'payOne', 'payAll', 'saveSettings', 'syncNow', 'count', 'cleanSkip',
  'cleanAddSave', 'expAdd', 'expDel'];
function newCid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function todayLocal() {
  const d = new Date(), p2 = n => ('0' + n).slice(-2);
  return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
}
function fmtAt(ms) {
  const d = new Date(ms || Date.now()), p2 = n => ('0' + n).slice(-2);
  return p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}


// 1. последние данные — показываем сразу при открытии, пока грузятся свежие
let syncedAt = 0, snapTimer = null;
function saveSnap() {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => {
    if (!state || !syncedAt || inflight || ui.stale) return;
    STORE.set('snap3', { at: syncedAt, data: state });
  }, 400);
}
function restoreSnap() {
  const sn = STORE.get('snap3');
  if (!sn || !sn.data || !sn.data.items || Date.now() - sn.at > SNAP_DAYS * 864e5) { if (sn) STORE.del('snap3'); return false; }
  state = sn.data; state.today = todayLocal(); syncedAt = sn.at;
  loadQueue().forEach(q => applyLocal(q.action, q.extra, true)); // то, что нажато без сети, — тоже на экран
  return true;
}

// 2. очередь действий без сети
function loadQueue() { return STORE.get('queue') || []; }
function queueLen() { try { return loadQueue().length; } catch (e) { return 0; } }
function saveQueue(q) { if (!q.length) { STORE.del('queue'); return true; } return STORE.set('queue', q); }
function enqueue(action, extra, key) {
  const q = loadQueue();
  q.push({ action: action, extra: extra, key: key || '' });
  if (!saveQueue(q)) return false;
  markQueued(extra.cid);
  return true;
}
function markQueued(cid) {
  if (!cid || !state) return;
  (state.items || []).forEach(i => (i.purchases || []).concat(i.problems || []).forEach(x => { if (x.id === cid) x.queued = true; }));
}
function setOrder(list, c) {
  const i = list.findIndex(x => x.a === c.apartment && x.i.toLowerCase() === c.item.toLowerCase());
  if (c.status === ORD.done || c.status === ORD.gone) { if (i >= 0) list.splice(i, 1); }
  else if (i >= 0) list[i].s = c.status;
  else if (c.status === ORD.need || c.status === ORD.self) list.push({ a: c.apartment, i: c.item, s: c.status });
}
/** Повторяет на экране действие из очереди (после перезапуска или свежей загрузки). */
function applyLocal(a, x, queued) {
  if (!state) return;
  if (a === 'orderSet') { (x.changes || []).forEach(c => setOrder(state.order = state.order || [], c)); return; }
  if (a === 'delPurchase') { state.items.forEach(i => { i.purchases = (i.purchases || []).filter(p => p.id !== x.id); }); return; }
  const it = x.key ? state.items.find(i => i.key === x.key) : null;
  if (!it) return;
  const t = fmtAt(x.atMs);
  if (a === 'time') it.maidTime = x.time;
  if (a === 'start') it.started = t;
  if (a === 'done') it.done = t;
  if (a === 'undo') { if (x.field === 'done') it.done = ''; else { it.started = ''; it.done = ''; } }
  if (a === 'comment') it.comment = x.text;
  if (a === 'purchase' && !(it.purchases || []).some(p => p.id === x.cid)) it.purchases = (it.purchases || []).concat([{ id: x.cid,
    amount: Number(x.amount), what: x.what, receipt: !!x.photo, saving: true, queued: queued }]);
  if (a === 'problem' && !(it.problems || []).some(p => p.id === x.cid)) it.problems = (it.problems || []).concat([{ id: x.cid,
    text: x.text, photo: !!x.photo, saving: true, queued: queued }]);
}
let flushing = null, flushTimer = null;
/** Отправляет по порядку всё, что ждало отправки. quiet — без сообщений (обычная отложенная отправка). Возвращает, сколько ушло. */
function flushQueue(quiet) {
  if (flushing) return flushing;
  if (!queueLen()) return Promise.resolve(0);
  flushing = (async () => {
    let sent = 0;
    setSync(quiet ? 'Сохраняю…' : 'Отправляю сохранённое…');
    for (;;) {
      const q = loadQueue();
      if (!q.length) break;
      try { await withRetry(() => call(q[0].action, q[0].extra)); sent++; }
      catch (e) {
        if (e.offline) { ui.offline = true; break; } // сети всё ещё нет — попробуем позже
        toast('Не сохранилось: ' + e.message, true);
      }
      saveQueue(loadQueue().slice(1));
    }
    if (sent && !quiet) toast('Отправлено, что ждало сети: ' + sent);
    if (queueLen()) scheduleFlush();
    return sent;
  })().finally(() => { flushing = null; setSync(''); });
  return flushing;
}
function scheduleFlush() {
  if (flushTimer) return;
  flushTimer = setInterval(async () => {
    if (!queueLen()) { clearInterval(flushTimer); flushTimer = null; return; }
    if (deferred) return;
    if (await flushQueue()) reload();
  }, 20000);
}
window.addEventListener('online', () => { if (!deferred) flushQueue().then(() => reload()); });

// 3. черновики: начатый текст не пропадёт, если приложение закрылось
const DRAFT_RE = /^(cm|pt|ba|bw|nt)-/;
let drafts = {}, draftTimer = null;
function loadDrafts() {
  drafts = STORE.get('drafts') || {};
  Object.keys(drafts).forEach(id => { if (Date.now() - drafts[id].at > DRAFT_DAYS * 864e5) delete drafts[id]; });
}
function saveDrafts() { clearTimeout(draftTimer); draftTimer = setTimeout(() => STORE.set('drafts', drafts), 300); }
function setDraft(id, v) { if (v) drafts[id] = { v: v, at: Date.now() }; else delete drafts[id]; saveDrafts(); }
function clearDrafts() { Array.prototype.forEach.call(arguments, id => { delete drafts[id]; }); saveDrafts(); }
function applyDrafts() {
  Object.keys(drafts).forEach(id => {
    const el = document.getElementById(id);
    if (!el || el.dataset.dirty) return;
    if (el.value === drafts[id].v) { delete drafts[id]; saveDrafts(); return; } // уже сохранено
    el.value = drafts[id].v; el.dataset.dirty = '1';
  });
}

// 4. мелкие удобства: вкладка, фильтры, выбранный день (день — если открывали меньше 30 минут назад)
let prefsTimer = null;
function savePrefs() {
  clearTimeout(prefsTimer);
  prefsTimer = setTimeout(() => STORE.set('prefs', { tab: ui.tab, bkView: ui.bkView, bkApt: ui.bkApt, bkMode: ui.bkMode, mTab: ui.mTab,
    ordApt: ui.ordApt, sel: ui.sel, month: ui.month, at: Date.now() }), 300);
}
function loadPrefs() {
  const pr = STORE.get('prefs');
  if (!pr) return;
  ['tab', 'bkView', 'bkMode', 'mTab'].forEach(k => { if (pr[k]) ui[k] = pr[k]; });
  ['bkApt', 'ordApt'].forEach(k => { if (typeof pr[k] === 'string') ui[k] = pr[k]; });
  if (pr.sel && Date.now() - pr.at < 30 * 60000) { ui.sel = pr.sel; ui.month = pr.month || pr.sel.slice(0, 7); }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
/** Если таблица занята обновлением, сервер ничего не сохранил — можно спокойно повторить. */
async function withRetry(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      if (i < 4 && /обновляется/i.test(e.message)) { setSync('Таблица обновляется, жду…'); await sleep(8000); continue; }
      throw e;
    }
  }
}

// Кнопки срабатывают сразу: экран меняется, запрос уходит в фоне, по очереди.
const pending = {};
let inflight = 0, chain = Promise.resolve(), savedTimer = null;

function send(action, extra, key, okMsg) {
  extra = Object.assign({ atMs: Date.now() }, extra || {}); // время нажатия — важно для «Начать»/«Готово», отправленных позже
  if (deferred) { clearTimeout(deferred.timer); deferred = null; hideToast(); } // отложенное «Начать/Готово» уходит вместе с этим действием
  const canQueue = QUEUEABLE.indexOf(action) >= 0;
  if (canQueue && queueLen()) { // уже есть неотправленное — встаём в конец очереди, чтобы не перепутать порядок
    if (enqueue(action, extra, key)) { render(); setSync(''); flushQueue(true).then(n => { if (n) reload(); }); return Promise.resolve('queued'); }
  }
  inflight++;
  if (key) pending[key] = (pending[key] || 0) + 1;
  setSync('Сохраняю…');
  render();
  const p = chain.then(() => queueLen() ? flushQueue(true) : 0).then(() => withRetry(() => call(action, extra))).then(data => {
    inflight--; if (key) pending[key]--;
    ui.offline = false;
    applyData(data);
    render();
    if (!inflight) {
      syncedAt = Date.now(); saveSnap();
      setSync('Сохранено');
      clearTimeout(savedTimer); savedTimer = setTimeout(() => { if (!inflight) setSync(''); }, 2000);
    }
    if (okMsg) toast(okMsg);
    return data;
  }, err => {
    inflight--; if (key) pending[key]--;
    if (err.offline && canQueue && enqueue(action, extra, key)) {
      ui.offline = true; render(); setSync('');
      toast('Нет сети — сохранено на телефоне, отправлю, когда появится сеть');
      scheduleFlush();
      return 'queued';
    }
    setSync('');
    haptic('error');
    if (err.offline) { // такое действие без сети не выполнить — возвращаем экран как было
      ui.offline = true;
      toast('Нет сети — не сохранилось', true);
      if (restoreSnap()) render();
    } else {
      toast('Не сохранилось: ' + err.message, true);
      reload(); // вернуть экран к тому, что реально в таблице
    }
    throw err;
  });
  chain = p.catch(() => {});
  return p.catch(() => null); // null = не сохранилось (ошибка уже показана); 'queued' = ждёт сети
}

/**
 * «Начать» и «Готово» без вопроса «Вы уверены?»: экран меняется сразу, 5 секунд видна кнопка «Отменить»,
 * потом действие уходит на сервер. Действие сразу лежит в очереди на телефоне — не потеряется, даже если закрыть приложение.
 */
let deferred = null;
function deferSend(action, extra, key, label, revert) {
  commitDeferred();
  extra = Object.assign({ atMs: Date.now() }, extra);
  if (queueLen() || !enqueue(action, extra, key)) { send(action, extra, key); return; } // очередь занята или память недоступна — как обычно
  deferred = { atMs: extra.atMs, revert: revert, timer: setTimeout(commitDeferred, 5000) };
  render();
  toast(label, false, undoDeferred);
}
function commitDeferred() {
  if (!deferred) return;
  clearTimeout(deferred.timer); deferred = null; hideToast();
  flushQueue(true).then(n => { if (n) { syncedAt = Date.now(); reload(); } });
}
function undoDeferred() {
  if (!deferred) return;
  clearTimeout(deferred.timer);
  saveQueue(loadQueue().filter(q => !(q.extra && q.extra.atMs === deferred.atMs)));
  deferred.revert(); deferred = null;
  render(); setSync('');
}

function applyData(data) {
  if (!data) return;
  if (data.owner && !pending.own) state.owner = data.owner;
  if (data.maid) state.maid = data.maid;
  else if (data.item) state.maid = null; // деньги могли измениться — перезагрузим при открытии вкладки
  if (data.items) {
    if (!inflight) state = Object.assign(data, { owner: data.owner || state.owner, maid: data.maid || state.maid });
  } else if (data.item && !pending[data.item.key]) {
    const i = state.items.findIndex(x => x.key === data.item.key);
    if (i >= 0) state.items[i] = data.item;
  } else if (data.order && !pending.order) state.order = data.order;
}

let loading = false;
function setStale(v) { ui.stale = v; document.body.classList.toggle('stale', !!v); }

async function reload(full) {
  if (loading || deferred) return;
  loading = true;
  if (!inflight) setSync(ui.stale ? 'Обновляю…' : state ? '' : 'Загрузка…');
  try {
    await flushQueue(); // сначала — то, что ждало сети
    const needFull = full || (state && ui.sel > addDays(todayLocal(), 14));
    const data = await withRetry(() => call('list', needFull ? { full: 1 } : {}));
    if (!inflight) {
      const wasStale = ui.stale;
      state = Object.assign(data, { owner: state && state.owner, maid: state && state.maid });
      loadQueue().forEach(q => applyLocal(q.action, q.extra, true)); // если что-то ещё не ушло
      syncedAt = Date.now(); ui.offline = false; setStale(false);
      if (!ui.sel) { ui.sel = state.today; ui.month = state.today.slice(0, 7); }
      render(); setSync(''); saveSnap();
      // вкладки: подгружаем в фоне; если были показаны с прошлого раза — тихо обновляем
      // Ивану данные вкладок нужны и на экране «Сегодня» (что требует решения, долг) — обновляем каждый раз
      if (ui.tab !== 'clean' && ui.tab !== 'order' && !tabData()) loadTab(isOwner() ? 'owner' : 'maid');
      else setTimeout(() => prefetchTabs(wasStale || isOwner()), 300);
    }
  } catch (e) {
    setStale(false);
    if (/^Нет доступа/.test(e.message)) { // доступ закрыли — стираем всё, что хранилось на телефоне
      STORE.wipe(); state = null; setSync(''); document.body.classList.remove('owner');
      document.getElementById('tabs').innerHTML = '';
      document.getElementById('list').innerHTML = '<p class="empty">' + esc(e.message) + '</p>';
      return;
    }
    if (e.offline && state) {
      ui.offline = true; render(); setSync('');
      toast('Нет сети. Показаны данные от ' + fmtAt(syncedAt) + '. Нажатия сохранятся и отправятся, когда появится сеть.');
      scheduleFlush();
    } else {
      setSync(''); toast(e.message, true);
      if (!state) document.getElementById('list').innerHTML = '<p class="empty">' + esc(e.message) + '</p>';
      else render();
    }
  } finally { loading = false; }
}
function tabData() { return state && (ownerView() ? state.owner : state.maid); }

/** Выбран день дальше загруженных двух недель — догружаем весь график (один раз). */
let fullP = null;
function ensureFull() {
  if (fullP || !state || state.loadedUntil >= state.until) return;
  fullP = withRetry(() => call('list', { full: 1 })).then(data => {
    if (inflight) return;
    state = Object.assign(data, { owner: state.owner, maid: state.maid });
    loadQueue().forEach(q => applyLocal(q.action, q.extra, true));
    render(); saveSnap();
  }).catch(e => toast(e.message, true)).finally(() => { fullP = null; });
}

// вкладки Ивана и «Деньги» горничной грузятся в фоне сразу после графика,
// поэтому при переходе на вкладку данные уже на экране. quiet = без «Загрузка…» и без лишней перерисовки.
function loadTab(kind, quiet) {
  const key = kind === 'owner' ? 'ownerP' : 'maidP';
  if (!ui[key]) {
    if (!quiet) { setSync('Загрузка…'); render(); }
    ui[key] = withRetry(() => call(kind)).then(d => {
      if (kind === 'owner' && !pending.own) state.owner = d.owner;
      if (kind === 'maid' && !pending.maid) state.maid = d.maid;
      saveSnap();
    }).catch(e => { if (!quiet) toast(e.message, true); })
      .finally(() => { ui[key] = null; });
  } else if (!quiet) setSync('Загрузка…');
  return ui[key].then(() => { if (!inflight) { if (!quiet) setSync(''); render(); } });
}
function prefetchTabs(refresh) {
  if (!state) return;
  if (isOwner()) { if (!state.owner || refresh) loadTab('owner', true); }
  else if (!state.maid || refresh) loadTab('maid', true);
}

// пока приложение открыто — раз в минуту лёгкая проверка: изменилось ли что-то на сервере
setInterval(async () => {
  if (document.hidden || !state || inflight || loading || deferred || queueLen() || ui.stale) return;
  const was = ui.ver;
  try { await call('ver'); } catch (e) { return; }
  if (was && ui.ver !== was && !inflight && !loading) reload();
}, 60000);

function skeleton() {
  document.getElementById('list').innerHTML = '<div class="box"><div class="skel"><i></i><i></i></div></div>' +
    '<div class="card"><div class="skel"><i></i><i></i><i></i><i></i></div></div>';
}

/* ---------- календарь: неделя, по нажатию на название месяца — весь месяц ---------- */
function dotsMap() {
  const m = {};
  state.items.forEach(it => { (m[it.date] = m[it.date] || []).push(it.done ? 'done' : it.skipped ? 'skip' : it.changed ? 'changed' : it.urgent ? 'urgent' : ''); });
  const K = { d: 'done', s: 'skip', c: 'changed', u: 'urgent', f: '' };
  (state.later || []).forEach(x => { (m[x[0]] = m[x[0]] || []).push(K[x[1]] || ''); });
  return m;
}
function dayBtn(iso, map, withWd) {
  const na = iso > until();
  const cls = ['d', iso < state.today ? 'past' : '', na ? 'na' : '', iso === state.today ? 'today' : '', iso === ui.sel ? 'sel' : ''].join(' ');
  return '<button class="' + cls + '" data-act="day" data-date="' + iso + '">' + (withWd ? '<span class="w">' + wd(iso) + '</span>' : '') +
    '<span class="n">' + Number(iso.slice(8)) + '</span><span class="dots">' +
    (na ? '' : (map[iso] || []).map(c => '<i class="dot ' + c + '"></i>').join('')) + '</span></button>';
}
function calendar() {
  const map = dotsMap();
  const [y, m] = ui.month.split('-').map(Number);
  let h = '<div class="box"><div class="cal-head"><button data-act="calStep" data-step="-1">‹</button>' +
    '<button class="mid' + (ui.calOpen ? ' open' : '') + '" data-act="calToggle">' + MONTHS[m - 1] + ' ' + y + ic('down') + '</button>' +
    '<button data-act="calStep" data-step="1">›</button></div>';
  if (!ui.calOpen) {
    const dow = (new Date(ui.sel + 'T12:00:00Z').getUTCDay() + 6) % 7; // пн = 0
    const mon = addDays(ui.sel, -dow);
    h += '<div class="week">';
    for (let i = 0; i < 7; i++) h += dayBtn(addDays(mon, i), map, true);
    return h + '</div></div>';
  }
  const startDow = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  h += '<div class="grid">';
  ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(w => { h += '<div class="wd">' + w + '</div>'; });
  for (let i = 0; i < startDow; i++) h += '<div></div>';
  for (let d = 1; d <= days; d++) h += dayBtn(ui.month + '-' + ('0' + d).slice(-2), map, false);
  return h + '</div><div class="legend"><span><i class="dot urgent"></i>заезд в тот же день</span>' +
    '<span><i class="dot"></i>без заезда</span><span><i class="dot changed"></i>изменено время</span>' +
    '<span><i class="dot done"></i>готово</span></div></div>';
}

/* ---------- карточка уборки: горничная ---------- */
function cardTop(it, cls) {
  const badge = it.extra && !it.urgent ? 'Без выезда гостей' : it.urgent ? 'Заезд в тот же день' : 'Заезда нет';
  return '<div class="' + ['card', it.changed ? 'changed' : it.urgent ? 'urgent' : '', it.done ? 'finished' : '', cls || ''].join(' ') + '">' +
    '<div class="top"><span class="apt">' + esc(it.apartment) + '</span><span class="badge">' + badge + '</span></div>' +
    '<div class="times">' + (it.extra ? '<span>Дополнительная уборка</span>' : '<span>Выезд до <b>' + esc(it.checkoutTime) + '</b></span>') +
    (it.urgent ? '<span>Заезд в <b>' + esc(it.checkinTime) + '</b></span>' : '') + '</div>';
}
function guestRow(label, g) {
  return '<div class="guest"><div class="lbl">' + label + (ownerView() && g.platform ? ' · ' + esc(g.platform) : '') + '</div><div class="row"><span>' +
    esc(g.name || 'гость') + (g.guests ? ' · ' + guestsWord(g.guests) : '') + '</span><span class="acts">' + phoneBtn(g.phone) + chatBtn(g) + '</span></div></div>';
}
function progLine(it) {
  const step = (ok, label) => '<span class="' + (ok ? 'ok' : '') + '">' + ic(ok ? 'check' : 'clock') + label + '</span>';
  return '<div class="prog">' + step(it.maidTime, it.maidTime ? 'буду в ' + esc(it.maidTime) : 'время') +
    step(it.started, it.started ? 'начато ' + esc(tm(it.started)) : 'начать') +
    step(it.video, it.video ? 'видео' + (it.video > 1 ? ' ' + it.video : '') : 'видео') +
    step(it.done, it.done ? 'готово ' + esc(tm(it.done)) : 'готово') + '</div>';
}
function card(it) {
  if (ownerView()) return ownerCard(it);
  const k = esc(it.key);
  const isToday = it.date === state.today;
  let h = cardTop(it);
  if (it.fromIvan) h += '<div class="ivan">От Ивана: ' + esc(it.fromIvan) + '</div>';
  if (!it.extra) h += guestRow('Выезжает', it.out);
  if (it.urgent) h += guestRow('Заезжает', it.next);
  else h += '<div class="guest muted">В этот день никто не заезжает' + (it.next.guests ? ' · следующие: ' + guestsWord(it.next.guests) : '') + '</div>';
  h += progLine(it);

  // время прибытия — одной строкой
  if (!it.started && !it.done) {
    if (it.maidTime && !ui.open['tm|' + it.key]) {
      h += '<div class="line"><span>Буду в квартире в <b>' + esc(it.maidTime) + '</b></span>' +
        '<button class="mini" data-act="tmEdit" data-key="' + k + '">' + ic('edit') + 'Изменить</button></div>';
    } else {
      h += '<div class="title" style="margin-top:12px">Во сколько будете в квартире?</div><div class="inline">' + t24('id="tm-' + k + '"', it.maidTime) +
        '<button class="btn" data-act="time" data-key="' + k + '">Сохранить</button></div>';
    }
    const w = arrivalCheck(it);
    if (w === 'late') h += '<div class="warn">Это позже заселения гостей (' + esc(it.checkinTime) + '). Иван получил предупреждение.</div>';
    if (w === 'tight') h += '<div class="warn">До заезда гостей меньше часа. Иван получил предупреждение.</div>';
    if (it.maidTime && !it.extra && hm(it.maidTime) < hm(it.checkoutTime)) {
      h += '<div class="note">Гости выезжают до ' + esc(it.checkoutTime) + ' — могут быть ещё в квартире.</div>';
    }
  }

  // одна главная кнопка — следующий шаг
  if (it.done) {
    const dur = hm(it.started) !== null && hm(it.done) !== null ? hm(it.done) - hm(it.started) : 0;
    h += '<div class="okline">Уборка завершена' + (tm(it.done) ? ' в ' + esc(tm(it.done)) : '') + (dur > 0 ? ' · ' + minText(dur) : '') + '. Спасибо!</div>';
    if (!it.paid && isToday) h += '<button class="btn ghost" data-act="undo" data-field="done" data-key="' + k + '">Отменить «Готово»</button>';
  } else if (!it.started) {
    if (isToday) h += '<button class="btn" data-act="start" data-key="' + k + '">' + ic('play') + 'Начать уборку</button>' +
      '<div class="muted" style="margin-top:6px">Нажмите, когда зайдёте в квартиру</div>';
    else h += '<div class="muted" style="margin-top:12px">' + (it.date > state.today ? 'Кнопка «Начать» появится в день уборки.'
      : 'День уборки прошёл. Если уборка была — напишите Ивану, он её засчитает.') + '</div>';
  } else if (!it.video) {
    h += '<button class="btn" data-act="video" data-key="' + k + '">' + ic('video') + 'Отправить видео-обзор</button>' +
      '<div class="muted" style="margin-top:6px">После уборки снимите квартиру и отправьте видео в чат бота. Оно появится здесь само в течение минуты.</div>' +
      '<button class="btn ghost" data-act="undo" data-field="start" data-key="' + k + '">Отменить «Начато»</button>';
  } else {
    h += '<button class="btn go" data-act="done" data-key="' + k + '">' + ic('check') + 'Готово</button>' +
      '<button class="btn ghost" data-act="video" data-key="' + k + '">Отправить ещё видео</button>';
  }

  // покупка, проблема, заметка — в панели снизу
  const sum = it.purchases.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  h += '<div class="row3"><button class="mini" data-act="sheet" data-s="buy" data-key="' + k + '">' + ic('receipt') + 'Покупка</button>' +
    '<button class="mini" data-act="sheet" data-s="prob" data-key="' + k + '">' + ic('alert') + 'Проблема</button>' +
    '<button class="mini" data-act="sheet" data-s="note" data-key="' + k + '">' + ic('note') + 'Заметка</button></div>';
  if (it.purchases.length) {
    h += '<div class="title" style="margin-top:12px">Покупки: ' + money(sum) + ' BYN</div>';
    it.purchases.forEach(p => {
      h += '<div class="buy"><span>' + money(p.amount) + ' BYN' + (p.what ? ' — ' + esc(p.what) : '') +
        (p.receipt ? '' : ' <span class="muted">без чека</span>') + '</span>' +
        (p.saving ? '<span class="muted">' + (p.queued ? 'ждёт сети' : 'сохраняю…') + '</span>' : p.paid ? '<span class="muted">оплачено</span>' :
          '<button class="x" data-act="delBuy" data-key="' + k + '" data-id="' + esc(p.id) + '">' + ic('x') + '</button>') + '</div>';
    });
  }
  (it.problems || []).forEach(p => {
    h += '<div class="prob">' + ic('alert') + ' ' + esc(p.text || 'фото') + ' <span class="muted">' +
      (p.saving ? (p.queued ? 'ждёт сети' : 'отправляю…') : 'отправлено ' + esc(tm(p.created))) + '</span></div>';
  });
  if (it.comment) h += '<div class="stat">' + ic('note') + ' ' + esc(it.comment) + '</div>';
  return h + '</div>';
}

/* ---------- карточка уборки: Иван ---------- */
function ownerCard(it) {
  const k = esc(it.key);
  if (it.skipped) {
    return cardTop(it, 'off') + '<div class="stat">Вы отметили: уборка не нужна. Горничная её не видит.</div>' +
      '<button class="btn sec" data-act="cleanSkip" data-skip="" data-key="' + k + '">Вернуть уборку</button></div>';
  }
  let h = cardTop(it);
  if (!it.extra) h += guestRow('Выезжает', it.out);
  if (it.urgent) h += guestRow('Заезжает', it.next);
  else if (it.next.id) h += guestRow('Следующий заезд ' + ddmmyy(it.next.date), it.next);
  else h += '<div class="guest muted">Дальше броней пока нет</div>';

  const st = [];
  st.push(it.maidTime ? 'будет в <b>' + esc(it.maidTime) + '</b>' : '<span class="muted">время не указала</span>');
  if (it.started) st.push('начала ' + esc(tm(it.started)));
  if (it.video) st.push('видео ' + it.video);
  if (it.done) st.push('<b>готово' + (tm(it.done) ? ' ' + esc(tm(it.done)) : ' (засчитано)') + '</b>');
  h += '<div class="steps"><div class="title">Горничная</div><div class="stat">' + st.join(' · ') + '</div>';
  const f = it.forecast;
  if (!it.done && f) {
    if (f.late > 0) h += '<div class="warn">Будет готова около ' + esc(f.ready) + ' — на ' + minText(f.late) + ' позже заезда. Предупредите гостей.</div>';
    else if (it.urgent) h += '<div class="okline">Будет готова около ' + esc(f.ready) + ' — успевает к заезду.</div>';
    else h += '<div class="muted" style="margin-top:4px">Будет готова около ' + esc(f.ready) + '</div>';
  } else if (!it.done && it.urgent && it.date <= addDays(state.today, 1)) h += '<div class="note">Заезд в день выезда, а время прихода не указано.</div>';
  if (it.comment) h += '<div class="stat">' + ic('note') + ' ' + esc(it.comment) + '</div>';
  if (it.purchases.length) {
    const sum = it.purchases.reduce((s, p) => s + (Number(p.amount) || 0), 0);
    h += '<div class="stat">Покупки: ' + money(sum) + ' BYN</div><div>' + it.purchases.map(p =>
      p.url ? '<button class="rcpt" data-act="openUrl" data-url="' + esc(p.url) + '">' + ic('receipt') + ' ' + money(p.amount) + (p.what ? ' · ' + esc(p.what) : '') + '</button>'
        : '<span class="chip-s">' + money(p.amount) + (p.what ? ' · ' + esc(p.what) : '') + ' · без чека</span> ').join('') + '</div>';
  }
  (it.problems || []).forEach(p => {
    h += '<div class="prob">' + ic('alert') + ' ' + esc(p.text || 'фото') + ' <span class="muted">' + esc(tm(p.created)) + '</span>' +
      (p.url ? ' <button class="rcpt" data-act="openUrl" data-url="' + esc(p.url) + '">Фото</button>' : '') + '</div>';
  });
  h += '</div>';
  // для горничной — одной строкой, правка в панели снизу
  h += '<div class="line"><span><span class="muted">Для горничной:</span> ' + (it.fromIvan ? esc(it.fromIvan) : 'обычное время, без примечаний') + '</span>' +
    '<button class="mini" data-act="sheet" data-s="owner" data-key="' + k + '">' + ic('edit') + 'Изменить</button></div>';
  const acts = [];
  if (it.video) acts.push('<button class="mini" data-act="ownVideo" data-key="' + k + '">' + ic('video') + 'Видео в чат</button>');
  if (!it.done && it.date <= state.today) acts.push('<button class="mini" data-act="count" data-yes="1" data-key="' + k + '">' + ic('check') + 'Засчитать уборку</button>');
  if (!it.done && !it.started) acts.push('<button class="mini red" data-act="cleanSkip" data-skip="1" data-key="' + k + '">' + ic('x') + (it.extra ? 'Удалить уборку' : 'Уборка не нужна') + '</button>');
  if (acts.length) h += '<div class="acts" style="margin-top:10px">' + acts.join('') + '</div>';
  return h + '</div>';
}

/* ---------- экран Ивана «Сегодня» ---------- */
function attention() {
  const a = [], o = state.owner, t = state.today, t1 = addDays(t, 1);
  state.items.forEach(it => {
    if (it.skipped || it.done || (it.date !== t && it.date !== t1)) return;
    const f = it.forecast;
    if (it.urgent && f && f.late > 0) a.push({ bad: 1, text: it.apartment + ' · ' + it.day + ': будет готова около ' + f.ready + ', заезд в ' + it.checkinTime +
      ' — позже на ' + minText(f.late), btn: '<button class="mini" data-act="day" data-date="' + it.date + '">Открыть</button>' + chatBtn(it.next) });
    else if (it.urgent && !it.maidTime && !it.started) a.push({ text: it.apartment + ' · ' + it.day + ': заезд в день выезда, горничная не указала время',
      btn: '<button class="mini" data-act="day" data-date="' + it.date + '">Открыть</button>' });
  });
  state.items.filter(it => it.date === t).forEach(it => (it.problems || []).forEach(p => a.push({ bad: 1, text: 'Проблема · ' + it.apartment + ': ' + (p.text || 'фото'),
    btn: p.url ? '<button class="mini" data-act="openUrl" data-url="' + esc(p.url) + '">Фото</button>' : '' })));
  if (!o) return a;
  if (o.errors) a.push({ bad: 1, text: 'Брони обновились с ошибкой: ' + o.errors, btn: '<button class="mini" data-act="syncNow">Обновить сейчас</button>' });
  (o.overlaps || []).forEach(x => a.push({ bad: 1, text: 'Пересечение броней · ' + x.apartment + ': ' + ddmmyy(x.a.checkIn) + '–' + ddmmyy(x.a.checkOut) + ' ' +
    (x.a.guest || 'гость') + ' и ' + ddmmyy(x.b.checkIn) + '–' + ddmmyy(x.b.checkOut) + ' ' + (x.b.guest || 'гость'),
    btn: '<button class="mini" data-act="bkGo" data-id="' + esc(x.b.id) + '">К брони</button>' }));
  o.bookings.forEach(b => {
    const id = esc(b.id), lbl = b.apartment + ', ' + ddmmyy(b.checkIn) + '–' + ddmmyy(b.checkOut) + (b.guest ? ', ' + b.guest : '');
    if (String(b.status).indexOf('нет на площадке') === 0 && b.checkOut >= t) a.push({ text: 'Бронь пропала с площадки: ' + lbl + '. Проверьте в кабинете ' + b.platform + '.',
      btn: '<button class="mini" data-act="bkCancel" data-id="' + id + '">Отменена</button><button class="mini" data-act="bkGo" data-id="' + id + '">К брони</button>' });
    else if (b.status === 'подтверждена' && b.income === '' && b.checkOut >= addDays(t, -30)) a.push({ text: 'Бронь без суммы: ' + lbl + ' — в доходах считается как 0.',
      btn: '<button class="mini" data-act="bkGo" data-id="' + id + '">Вписать сумму</button>' });
  });
  ((o.money || {}).pending || []).forEach(p => a.push({ text: 'Не отмечено «Готово»: ' + p.apartment + ' · ' + shortDay(p.date) + '. Уборка была?',
    btn: '<button class="mini" data-act="count" data-yes="1" data-key="' + esc(p.key) + '">Засчитать</button>' +
      '<button class="mini" data-act="count" data-yes="" data-key="' + esc(p.key) + '">Не было</button>' }));
  return a;
}
function ownerToday(sel, dayItems) {
  let h = '';
  if (sel === state.today) {
    h += attention().map(x => '<div class="att' + (x.bad ? ' bad' : '') + '">' + esc(x.text) + (x.btn ? '<div class="acts">' + x.btn + '</div>' : '') + '</div>').join('');
  }
  return h;
}
function ownerExtras(sel, dayItems) {
  const o = state.owner;
  let h = '';
  if (o) { // заезды в свободные квартиры (уборки в этот день нет)
    const busy = {};
    dayItems.forEach(it => { if (it.urgent && !it.skipped) busy[it.apartment] = true; });
    const arr = o.bookings.filter(b => b.checkIn === sel && isLive(b.status) && !busy[b.apartment]);
    if (arr.length) h += '<h2>Заезды</h2>' + arr.map(b => '<div class="box"><div class="kv"><b>' + esc(b.apartment) + '</b><span class="muted">заезд в ' + esc(state.checkin) +
      ' · ' + b.nights + ' н.</span></div>' + guestRow('Заезжает', { name: b.guest, phone: b.phone, guests: b.guests, platform: b.platform, id: b.id, chat: b.chat }) + '</div>').join('');
  }
  h += '<button class="btn sec" data-act="sheet" data-s="cleanAdd">' + ic('plus') + 'Добавить уборку</button>';
  if (sel === state.today) {
    const need = (state.order || []).filter(x => x.s === ORD.need).length;
    h += '<h2>Коротко</h2><div class="box"><button class="tile" data-act="goMoney" style="background:none;padding:0"><span><span class="muted">К оплате горничной</span><br><b>' +
      (o ? money(o.money.total) + ' BYN' : '…') + '</b></span>' + ic('right') + '</button></div>' +
      '<div class="box"><button class="tile" data-act="goOrder" style="background:none;padding:0"><span><span class="muted">Заказ расходников</span><br><b>' +
      (need ? 'нужно: ' + need : 'пусто') + '</b>' + (((state.order || []).length - need) > 0 ? ' <span class="muted">· в работе: ' + ((state.order || []).length - need) + '</span>' : '') +
      '</span>' + ic('right') + '</button></div>';
  }
  return h;
}

/* ---------- выбор времени: стандартное колесо iOS, показ всегда в 24-часовом формате ---------- */
function t24(attrs, val, cls) {
  return '<span class="t24' + (cls ? ' ' + cls : '') + '"><input type="time" ' + attrs + ' value="' + esc(val || '') + '">' +
    '<b' + (val ? '' : ' class="empty"') + '>' + (val ? esc(val) : '--:--') + '</b></span>';
}
function syncT24(root) {
  (root || document).querySelectorAll('.t24 input').forEach(i => {
    const b = i.nextElementSibling; if (!b) return;
    b.textContent = i.value || '--:--'; b.className = i.value ? '' : 'empty';
  });
}
/** Выбранное в панели время (до сохранения). Берётся из пометки Ивана. */
function tcSel(it) {
  ui.tc = ui.tc || {};
  let sel = ui.tc[it.key];
  if (!sel || (!sel.dirty && sel.base !== it.timeChange)) {
    const t = itemTimes(it.timeChange);
    sel = ui.tc[it.key] = { out: t.checkoutTime, in: t.checkinTime, base: it.timeChange, dirty: false };
  }
  return sel;
}
/** Текст для горничной и для таблицы: «Поздний выезд 12:30 · Ранний заезд 13:00». Обычное время — пусто. */
function tcText(sel, it) {
  const co = state.checkout, ci = state.checkin, parts = [];
  if (!it.extra && sel.out && sel.out !== co) parts.push((hm(sel.out) > hm(co) ? 'Поздний выезд ' : 'Ранний выезд ') + sel.out);
  if (it.urgent && sel.in && sel.in !== ci) parts.push((hm(sel.in) < hm(ci) ? 'Ранний заезд ' : 'Поздний заезд ') + sel.in);
  return parts.join(' · ');
}
/** Подсказки под колёсами. Обновляются на месте, без перерисовки полей, — иначе колесо iOS закрывается на каждом шаге. */
function tcInfo(it) {
  const sel = tcSel(it);
  let h = '';
  if (it.urgent && !it.extra) {
    const gap = hm(sel.in) - hm(sel.out);
    if (gap <= 0) h += '<div class="warn">Заезд раньше выезда — проверьте время.</div>';
    else if (gap < 60) h += '<div class="warn">На уборку остаётся меньше часа.</div>';
    else if (gap < 120) h += '<div class="note">На уборку ' + minText(gap) + '.</div>';
  }
  const legacy = it.timeChange && !sel.dirty && !/\d{1,2}[:.]\d{2}/.test(it.timeChange) ? it.timeChange : '';
  return h + '<div class="tc-preview">Горничная увидит: <b>' + esc(tcText(sel, it) || 'обычное время') + '</b>' +
    (legacy ? '<div class="muted">Сейчас записано: «' + esc(legacy) + '» — при сохранении заменится.</div>' : '') + '</div>';
}
function tcReset(w, k, val, def) {
  return val !== def ? '<button class="link" data-act="tcPick" data-key="' + k + '" data-w="' + w + '" data-v="' + def + '">вернуть обычное ' + def + '</button>'
    : '<div class="muted" style="margin-top:4px">обычное время</div>';
}
function timeField(label, w, k, val, def) {
  return '<label class="f">' + label + t24('data-tc="' + w + '" data-key="' + k + '"', val, 'big') + '</label><div id="tcr-' + w + '">' + tcReset(w, k, val, def) + '</div>';
}
function tcRefresh(it) {
  const sel = tcSel(it), k = esc(it.key);
  const set = (id, h) => { const el = document.getElementById(id); if (el) el.innerHTML = h; };
  set('tcr-out', tcReset('out', k, sel.out, state.checkout));
  set('tcr-in', tcReset('in', k, sel.in, state.checkin));
  set('tc-info', tcInfo(it));
}

/* ---------- панель снизу ---------- */
function sheetHtml() {
  const s = ui.sheet;
  if (!s) return '';
  const it = s.key ? findItem(s.key) : null, k = esc(s.key || '');
  const close = '<button class="btn sec" data-act="sheetClose">Отмена</button>';
  if (s.type === 'buy' && it) return '<h3>Покупка · ' + esc(it.apartment) + '</h3><div class="form">' +
    '<input id="ba-' + k + '" inputmode="decimal" placeholder="Сумма, BYN"><input id="bw-' + k + '" placeholder="Что купили">' +
    '<label class="file">Фото чека<input id="bf-' + k + '" type="file" accept="image/*"></label>' +
    '<button class="btn" data-act="buySave" data-key="' + k + '">Сохранить покупку</button>' + close + '</div>';
  if (s.type === 'prob' && it) return '<h3>Проблема · ' + esc(it.apartment) + '</h3><div class="muted">Иван получит сообщение сразу.</div><div class="form">' +
    '<label class="file">Фото<input id="pf-' + k + '" type="file" accept="image/*"></label>' +
    '<textarea id="pt-' + k + '" placeholder="Что случилось: сломалось, протекает, грязно после гостей…"></textarea>' +
    '<button class="btn" data-act="probSend" data-key="' + k + '">Отправить Ивану</button>' + close + '</div>';
  if (s.type === 'note' && it) return '<h3>Заметка · ' + esc(it.apartment) + '</h3><div class="form">' +
    '<textarea id="cm-' + k + '" placeholder="Что заметили в квартире">' + esc(it.comment) + '</textarea>' +

/** Шахматка: квартиры по строкам, дни месяца по колонкам. День выезда и заезда — половинки клетки. */
function chess(o) {
  const ym = ui.bkMonth || state.today.slice(0, 7);
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const iso = d => ym + '-' + ('0' + d).slice(-2);
  const live = o.bookings.filter(b => String(b.status).indexOf('отменена') !== 0);
  const cls = b => String(b.status).indexOf('нет на площадке') === 0 ? 's-bad' : b.status === 'не оплачена' ? 's-warn' : '';
  const col = b => String(b.status).indexOf('нет на площадке') === 0 ? 'var(--red)' : b.status === 'не оплачена' ? 'var(--orange)' : 'var(--blue)';
  let h = '<div class="box"><div class="cal-head"><button data-act="bkMonth" data-step="-1">‹</button><b>' + MONTHS[m - 1] + ' ' + y +
    '</b><button data-act="bkMonth" data-step="1">›</button></div><div class="chess" id="chess"><div class="g" style="grid-template-columns:64px repeat(' + days + ',30px)"><div class="a top"></div>';
  for (let d = 1; d <= days; d++) {
    const dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    h += '<div class="h' + (dow === 0 || dow === 6 ? ' we' : '') + (iso(d) === state.today ? ' td' : '') + '">' + d + '</div>';
  }
  const free = {};
  o.apartments.forEach(apt => {
    const list = live.filter(b => b.apartment === apt);
    h += '<div class="a">' + esc(apt) + '</div>';
    free[apt] = 0;
    for (let d = 1; d <= days; d++) {
      const day = iso(d);
      const night = list.filter(b => b.checkIn <= day && day < b.checkOut), out = list.find(b => b.checkOut === day);
      const cin = night.find(b => b.checkIn === day), stay = night[0];
      if (!night.length && day >= state.today) free[apt]++;
      let c = '', st = '', id = '', style = '';
      if (night.length > 1) { c = 'over'; id = night[1].id; }
      else if (cin && out) { c = 'both'; st = cls(cin); id = cin.id; style = '--c2:' + col(out); }
      else if (cin) { c = 'in'; st = cls(cin); id = cin.id; }
      else if (stay) { c = 'full'; st = cls(stay); id = stay.id; }
      else if (out) { c = 'out'; st = cls(out); id = out.id; }
      h += '<button class="c ' + c + ' ' + st + (day === state.today ? ' td' : '') + (id && id === ui.bkPick ? ' pick' : '') + '"' + (style ? ' style="' + style + '"' : '') +
        (id ? ' data-act="bkPick" data-id="' + esc(id) + '"' : '') + '></button>';
    }
  });
  h += '</div></div><div class="legend"><span><i class="dot urgent"></i>бронь</span><span><i class="dot changed"></i>не оплачена</span>' +
    '<span><i class="dot" style="background:var(--red)"></i>пропала или пересечение</span></div>' +
    '<div class="muted" style="margin-top:8px">Свободных ночей' + (ym === state.today.slice(0, 7) ? ' до конца месяца' : '') + ': ' +
    o.apartments.map(a => esc(a) + ' — ' + free[a]).join(' · ') + '</div></div>';
  const b = ui.bkPick && o.bookings.find(x => x.id === ui.bkPick);
  h += b ? '<div class="box">' + bookingRow(b) + '</div>' : '<div class="muted" style="padding:0 6px 10px">Нажмите на бронь в шахматке, чтобы открыть её.</div>';
  return h;
}

/** Не теряем то, что печатают или выбрали, пока приходят ответы сервера. */
function keepInputs(list, draw) {
  const typed = {}, files = {};
  list.querySelectorAll('input:not([type=file]), textarea, select').forEach(el => { if (el.dataset.dirty && el.id) typed[el.id] = el.value; });
  list.querySelectorAll('input[type=file]').forEach(el => { files[el.id] = el; });
  const focusId = document.activeElement && list.contains(document.activeElement) && document.activeElement.id;
  draw();
  Object.keys(typed).forEach(id => { const el = document.getElementById(id); if (el) { el.value = typed[id]; el.dataset.dirty = '1'; } });
  Object.keys(files).forEach(id => { const el = document.getElementById(id); if (el) el.replaceWith(files[id]); });
  if (focusId) { const el = document.getElementById(focusId); if (el && el.focus) el.focus(); }
  syncT24(list);
  savePrefs();
}

/** Сжимаем фото чека до ~1600 px, чтобы быстро загружалось. */
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.75).split(',')[1]);
    };
    img.onerror = () => reject(new Error('Не удалось открыть фото'));
    img.src = URL.createObjectURL(file);
  });
}

    send('cleanAdd', req, 'own', 'Уборка добавлена');
    return true;
  }
  if (a === 'ordBulk') {
    const to = b.dataset.v;
    if (!(await confirmBox(to === 'sent' ? 'Отметить всё «нужно» как заказанное? Горничная получит сообщение.' : 'Всё заказанное привезли?'))) return true;
    ordFlush();
    state.order = (state.order || []).filter(x => !(to === 'done' && x.s === ORD.sent));
    if (to === 'sent') state.order.forEach(x => { if (x.s === ORD.need) x.s = ORD.sent; });
    haptic('success');
    send('orderSet', { bulk: to }, 'order', to === 'sent' ? 'Отмечено: заказано' : 'Отмечено: привезено');
    return true;
  }
  if (a === 'ordCopy') {
    const t = orderCopyText();
    if (!t) { toast('В списке нет позиций «нужно»'); return true; }
    copyText(t); haptic('success'); toast('Список скопирован');
    return true;
  }
  if (!o) return false;
  if (a === 'bkMode') { ui.bkMode = b.dataset.v; render(); return true; }
  if (a === 'bkMonth') {
    const ym = ui.bkMonth || state.today.slice(0, 7);
    ui.bkMonth = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + Number(b.dataset.step), 1)).toISOString().slice(0, 7);
    render(); return true;
  }
  if (a === 'bkPick') { ui.bkPick = b.dataset.id; pick(); render(); return true; }
  if (a === 'bkView') { ui.bkView = b.dataset.v; render(); return true; }
  if (a === 'bkApt') { ui.bkApt = b.dataset.v; render(); return true; }
  if (a === 'mTab') { ui.mTab = b.dataset.v; render(); return true; }
  if (a === 'bkForm') { ui.open.bkForm = !ui.open.bkForm; render(); return true; }
  if (a === 'bkOpen') { ui.open['bk|' + b.dataset.id] = true; render(); return true; }
  if (a === 'bkAdd') {
    const req = { platform: v('nb-platform'), apartment: v('nb-apt'), checkIn: v('nb-in'), checkOut: v('nb-out'),
      guests: v('nb-guests'), income: num(v('nb-income')), guest: v('nb-guest'), phone: v('nb-phone'), comment: v('nb-comment') };
    if (!req.checkIn || !req.checkOut || req.checkOut <= req.checkIn) { toast('Проверьте даты заезда и выезда', true); return true; }
    const hit = o.bookings.find(x => x.apartment === req.apartment && isLive(x.status) && x.checkIn < req.checkOut && req.checkIn < x.checkOut);
    if (hit) {
      if (!(await confirmBox('Эти даты пересекаются с бронью ' + ddmmyy(hit.checkIn) + '–' + ddmmyy(hit.checkOut) + ' (' + (hit.guest || 'гость') + ', ' +
        hit.platform + '). Всё равно добавить?'))) return true;
      req.force = true;
    }
    ui.open.bkForm = false; undirty('nb-');
    o.bookings.push({ id: 'tmp' + Date.now(), platform: req.platform, apartment: req.apartment, checkIn: req.checkIn, checkOut: req.checkOut,
      nights: Math.round((new Date(req.checkOut) - new Date(req.checkIn)) / 864e5), guests: req.guests, status: 'сохраняю…',
      guest: req.guest, phone: req.phone, income: req.income === '' ? '' : Number(req.income), comment: req.comment, editable: false });
    o.bookings.sort((x, y) => (x.checkIn < y.checkIn ? -1 : 1));
    haptic('success');
    send('bkAdd', req, 'own', 'Бронь добавлена — уборка появится в графике');
    return true;
  }
  if (a === 'bkSave' || a === 'bkCancel' || a === 'bkRestore') {
    const id = b.dataset.id, bk = o.bookings.find(x => x.id === id);
    if (!bk) return true;
    if (a === 'bkCancel' && !(await confirmBox('Отметить бронь как отменённую? Уборка исчезнет из графика.'))) return true;
    const req = { id: id };
    if (a === 'bkSave') {
      if (byId('be-income-' + id)) { req.income = num(v('be-income-' + id)); bk.income = req.income === '' ? '' : Number(req.income); }
      req.comment = v('be-comment-' + id); bk.comment = req.comment;
    } else { req.status = a === 'bkCancel' ? 'отменена' : 'подтверждена'; bk.status = req.status; }
    ui.open['bk|' + id] = false; undirty('be-'); haptic('success');
    send('bkEdit', req, 'own', 'Сохранено');
    return true;
  }
  if (a === 'payOne' || a === 'payAll') {
    const m = o.money;
    const rows = a === 'payAll' ? m.unpaid.slice() : m.unpaid.filter(r => r.key === key);
    const sum = Math.round(rows.reduce((s, r) => s + r.sum, 0) * 100) / 100;
    if (!rows.length || !(await confirmBox('Отметить оплату ' + money(sum) + ' BYN? Горничная получит сообщение.'))) return true;
    const keys = rows.map(r => r.key);
    m.unpaid = m.unpaid.filter(r => keys.indexOf(r.key) < 0);
    m.total = Math.round(m.unpaid.reduce((s, r) => s + r.sum, 0) * 100) / 100;
    m.fees = Math.round(m.unpaid.reduce((s, r) => s + r.fee, 0) * 100) / 100;
    m.buys = Math.round(m.unpaid.reduce((s, r) => s + r.buy, 0) * 100) / 100;
    haptic('success');
    send('pay', { items: rows.map(r => ({ key: r.key, fee: !!r.feeDue, buyIds: r.buyIds || [] })), cid: newCid() }, 'own', 'Оплата отмечена');
    return true;
  }
  if (a === 'expAdd') {
    const req = { amount: num(v('ex-amount')), cur: v('ex-cur'), date: v('ex-date'), apartment: v('ex-apt'), what: v('ex-what'), cid: newCid() };
    if (!(Number(req.amount) > 0)) { toast('Укажите сумму', true); return true; }
    o.expenses = [{ id: req.cid, date: req.date || state.today, apartment: req.apartment, amount: Number(req.amount), cur: req.cur, what: req.what, saving: true }]
      .concat(o.expenses || []);
    undirty('ex-'); ['ex-amount', 'ex-what'].forEach(id => { const el = byId(id); if (el) el.value = ''; });
    haptic('success');
    send('expAdd', req, 'own', 'Расход добавлен');
    return true;
  }
  if (a === 'expDel') {
    if (!(await confirmBox('Удалить этот расход?'))) return true;
    o.expenses = (o.expenses || []).filter(x => x.id !== b.dataset.id);
    send('expDel', { id: b.dataset.id }, 'own');
    return true;
  }
  if (a === 'saveSettings') {
    const req = { checkout: v('st-checkout'), checkin: v('st-checkin'), cleanFee: num(v('st-fee')), rate: num(v('st-rate')), utilities: num(v('st-util')) };
    Object.assign(o.settings, { checkout: req.checkout, checkin: req.checkin, cleanFee: Number(req.cleanFee), rate: Number(req.rate),
      utilities: Number(req.utilities) });
    undirty('st-'); haptic('success');
    send('setSettings', req, 'own', 'Настройки сохранены');
    return true;
  }
  return false;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || !state) return;
  const key = b.dataset.key, a = b.dataset.act;
  const it = () => key ? findItem(key) : null; // карточку ищем заново: данные могли обновиться, пока ждали ответа на вопрос
  const ok = () => haptic('success');
  if (a !== 'day' && a !== 'calStep') tap();
  if (ui.stale && MUTATING.indexOf(a) >= 0) { toast('Секунду, обновляю данные…'); return; }

  if (a === 'sheetClose') return closeSheet();
  if (a === 'sheet') return openSheet(b.dataset.s, key);
  if (a === 'openUrl') return openUrl(b.dataset.url);
  if (a === 'chat') {
    if (b.dataset.q) toast('Гостей с таким именем несколько — проверьте, тот ли чат');
    if (b.dataset.url) return openUrl(b.dataset.url);
    toast('Ищу чат…');
    try {
      const d = await call('chat', { id: b.dataset.id });
      if (!d.found) toast('Чат не нашёлся — открываю сообщения Авито');
      else { // запомним ссылку, чтобы в следующий раз открылась сразу
        state.items.forEach(i => [i.out, i.next].forEach(g => { if (g && g.id === b.dataset.id) g.chat = d.url; }));
        if (state.owner) state.owner.bookings.forEach(x => { if (x.id === b.dataset.id) x.chat = d.url; });
      }
      openUrl(d.url);
    } catch (err) { toast(err.message, true); }
    return;
  }
  if (a === 'calToggle') { ui.calOpen = !ui.calOpen; ui.month = ui.sel.slice(0, 7); return render(); }
  if (a === 'calStep') {
    const step = Number(b.dataset.step);
    if (ui.calOpen) {
      const [y, m] = ui.month.split('-').map(Number);
      ui.month = new Date(Date.UTC(y, m - 1 + step, 1)).toISOString().slice(0, 7);
    } else { ui.sel = addDays(ui.sel, 7 * step); ui.month = ui.sel.slice(0, 7); }
    return render();
  }
  if (a === 'day') { pick(); ui.sel = b.dataset.date; ui.month = ui.sel.slice(0, 7); ui.calOpen = false; if (ui.tab !== 'clean') { ui.tab = 'clean'; ui.sub = ''; } return render(); }
  if (a === 'addHome') { try { tg.addToHomeScreen(); } catch (err) { toast('Не получилось — обновите Telegram', true); } return; }
  if (a === 'syncNow') { setSync('Обновляю брони…'); send('sync', {}, isOwner() ? 'own' : 'maid', 'Обновлено'); return; }

  // заказ расходников
  if (a === 'ordApt') { ui.ordApt = b.dataset.v; pick(); return render(); }
  if (a === 'ordTap') {
    const name = b.dataset.i, cur = (state.order || []).find(x => x.a === ui.ordApt && x.i.toLowerCase() === name.toLowerCase());
    if (cur && cur.s === ORD.sent) return toast(ownerView() ? 'Уже заказано — отметьте «Привезено» в списке выше' : 'Иван уже заказал это');
    pick();
    return ordChange(name, cur ? ORD.gone : ORD.need);
  }
  if (a === 'ordSet') { pick(); return ordChange(b.dataset.i, b.dataset.v); }
  if (a === 'ordAdd') {
    const name = v('ord-x').replace(/\s+/g, ' ').slice(0, 60);
    if (!name) return toast('Напишите, что нужно', true);
    const el = byId('ord-x'); el.value = ''; delete el.dataset.dirty;
    ok();
    return ordChange(name, ORD.need);
  }

  if (isOwner() && await ownerClick(a, b)) return;

  // уборка: горничная
  const item = it();
  if (!item) return;
  if (a === 'tmEdit') { ui.open['tm|' + key] = true; return render(); }
  if (a === 'time') {
    const el = byId('tm-' + key), t = el ? el.value.trim() : '';
    if (el) delete el.dataset.dirty;
    item.maidTime = t; ui.open['tm|' + key] = false; ok();
    return send('time', { key: key, time: t }, key, arrivalCheck(item) ? 'Время сохранено. Иван предупредит гостей' : 'Время сохранено');
  }
  if (a === 'start') {
    item.started = nowShort(); ok();
    return deferSend('start', { key: key }, key, 'Уборка начата', () => { const x = findItem(key); if (x) x.started = ''; });
  }
  if (a === 'video') {
    // ждём ответ: бот должен знать, к какой уборке придёт видео, до того как приложение закроется
    toast('Секунду…');
    if (!(await send('video', { key: key }, key))) return;
    toast('Отправьте видео в чат бота');
    setTimeout(() => { if (tg) tg.close(); }, 700);
    return;
  }
  if (a === 'done') {
    item.done = nowShort(); ok();
    return deferSend('done', { key: key }, key, 'Готово! Иван получит отчёт', () => { const x = findItem(key); if (x) x.done = ''; });
  }
  if (a === 'undo') {
    if (b.dataset.field === 'done') item.done = ''; else { item.started = ''; item.done = ''; }
    return send('undo', { key: key, field: b.dataset.field }, key, 'Отметка снята');
  }
  if (a === 'noteSave') {
    item.comment = v('cm-' + key);
    clearDrafts('cm-' + key); closeSheet(); ok();
    return send('comment', { key: key, text: item.comment }, key, 'Заметка сохранена');
  }
  if (a === 'buySave') {
    const amount = num(v('ba-' + key));
    if (!(Number(amount) > 0)) return toast('Укажите сумму в BYN, например 12,50', true);
    const fileEl = byId('bf-' + key);
    const file = fileEl && fileEl.files && fileEl.files[0];
    if (!file && !(await confirmBox('Сохранить без фото чека?'))) return;
    const what = v('bw-' + key), cid = newCid();
    clearDrafts('ba-' + key, 'bw-' + key); closeSheet();
    const cur = it();
    cur.purchases.push({ id: cid, amount: Number(amount), what: what, receipt: !!file, saving: true });
    ok(); render();
    let photo = '';
    try { if (file) photo = await compress(file); }
    catch (err) { cur.purchases = cur.purchases.filter(p => p.id !== cid); render(); return toast(err.message, true); }
    return send('purchase', { key: key, amount: amount, what: what, photo: photo, cid: cid }, key);
  }
  if (a === 'delBuy') {
    if (!(await confirmBox('Удалить эту покупку?'))) return;
    const cur = it();
    cur.purchases = cur.purchases.filter(p => p.id !== b.dataset.id); ok();
    return send('delPurchase', { id: b.dataset.id }, key);
  }
  if (a === 'probSend') {
    const fileEl = byId('pf-' + key);
    const file = fileEl && fileEl.files && fileEl.files[0];
    const text = v('pt-' + key);
    if (!file && !text) return toast('Сфотографируйте или опишите проблему', true);
    const cid = newCid();
    clearDrafts('pt-' + key); closeSheet();
    item.problems = (item.problems || []).concat([{ id: cid, text: text, photo: !!file, saving: true }]);
    ok(); render();
    let photo = '';
    try { if (file) photo = await compress(file); }
    catch (err) { item.problems = item.problems.filter(p => p.id !== cid); render(); return toast(err.message, true); }
    return send('problem', { key: key, text: text, photo: photo, cid: cid }, key, 'Отправлено Ивану');
  }
});

/* ---------- потянуть вниз — обновить ---------- */
(() => {
  const p = byId('ptr');
  p.innerHTML = ic('refresh');
  let y0 = null, d = 0;
  const reset = () => { p.classList.remove('spin'); p.style.opacity = ''; p.style.transform = ''; };
  addEventListener('touchstart', e => {
    y0 = scrollY <= 0 && !ui.sheet && e.touches.length === 1 && !e.target.closest('.chess') ? e.touches[0].clientY : null; d = 0;
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 === null) return;
    d = e.touches[0].clientY - y0;
    if (d > 0 && scrollY <= 0) { p.style.opacity = Math.min(1, d / 80); p.style.transform = 'translateY(' + (Math.min(d * 0.6, 64) - 50) + 'px)'; }
  }, { passive: true });
  addEventListener('touchend', () => {
    if (y0 === null) return;
    y0 = null;
    if (d > 90 && state && !inflight && !loading) { p.classList.add('spin'); tap(); reload(true).then(reset, reset); }
    else reset();
  });
})();

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { commitDeferred(); ordFlush(); }
  else if (state && !inflight) reload();
});

// старт: настройки вида и черновики → данные с прошлого открытия (если не старше 2 дней) или заготовка экрана → свежие данные
let started = false;
function start() {
  if (started || !UID) return;
  started = true;
  STORE.p = 'kv' + UID + ':';
  loadPrefs();
  loadDrafts();
  if (restoreSnap()) {
    setStale(true);
    if (!ui.sel) { ui.sel = state.today; ui.month = state.today.slice(0, 7); }
    render(); setSync('Обновляю…');
  } else skeleton();
  reload();
}
start();
</script>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="onTg()" onerror="onTgFail()"></script>
