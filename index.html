<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>График уборок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* своя палитра: светлая и тёмная (тема берётся из Telegram) */
  :root {
    color-scheme: light;
    --page: #f2f3f7; --bg: #ffffff; --bg2: #f0f1f5; --line: #e9eaef;
    --text: #16181d; --hint: #868a94; --link: #2f6fe4;
    --btn: #3b82f6; --btn-text: #ffffff;
    --green: #2ea05a; --orange: #e8891c; --red: #e05252; --grey: #b4b8c0; --blue: #3b82f6;
    --ok-bg: #e6f5ea; --ok-fg: #1f6b35; --info-bg: #e4edfd; --info-fg: #1d4f9a;
    --chg-bg: #fdeed9; --chg-fg: #8a4b08; --bad-bg: #fde6e6; --bad-fg: #a12f2f; --toast: #23252b;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #121318; --bg: #1d1f26; --bg2: #2a2d35; --line: #2a2d34;
    --text: #eceef3; --hint: #8f95a1; --link: #7aa7ff;
    --btn: #4a8cff; --btn-text: #ffffff;
    --green: #3fbf6f; --orange: #f0a04b; --red: #f06b6b; --grey: #5b606b; --blue: #4a8cff;
    --ok-bg: rgba(63,191,111,.16); --ok-fg: #86dba3; --info-bg: rgba(74,140,255,.18); --info-fg: #a9c6ff;
    --chg-bg: rgba(240,160,75,.17); --chg-fg: #f5c28a; --bad-bg: rgba(240,107,107,.17); --bad-fg: #ffadad; --toast: #34373f;
  }
  a { color: var(--link); text-decoration: none; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: var(--page); }
  header h1 { margin: 0; font-size: 20px; }
  header .right { display: flex; align-items: center; gap: 12px; }
  header button { border: 0; background: none; color: var(--link); font-size: 15px; padding: 6px 0; }
  #sync { font-size: 13px; color: var(--hint); }
  main { padding: 0 12px 40px; }
  .box { background: var(--bg); border-radius: 14px; padding: 12px; margin-bottom: 10px; }

  /* календарь */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-head b { font-size: 16px; }
  .cal-head button { border: 0; background: var(--bg2); color: var(--text); width: 36px; height: 32px;
    border-radius: 8px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .wd { font-size: 11px; color: var(--hint); padding: 2px 0; }
  .d { border: 0; background: none; color: var(--text); border-radius: 10px; padding: 5px 0 4px; min-height: 46px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 15px; }
  .d.past { color: var(--hint); }
  .d.today .n { border: 2px solid var(--btn); }
  .d.sel { background: var(--btn); color: var(--btn-text); }
  .d.sel .n { border-color: var(--btn-text); }
  .n { width: 26px; height: 26px; line-height: 22px; border-radius: 13px; border: 2px solid transparent; }
  .dots { display: flex; gap: 2px; height: 6px; align-items: center; }
  .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--green); }
  .dot.urgent { background: var(--blue); } .dot.changed { background: var(--orange); } .dot.done { background: var(--grey); }
  .bell { font-size: 8px; line-height: 6px; }
  .d.sel .dot { box-shadow: 0 0 0 1.5px var(--btn-text); }
  .d.na { color: var(--hint); opacity: .4; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--hint); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 16px 4px 8px; }
  .card { background: var(--bg); border-radius: 14px; padding: 14px; margin-bottom: 10px;
    border-left: 5px solid var(--green); }
  .card.urgent { border-left-color: var(--blue); }
  .card.changed { border-left-color: var(--orange); }
  .card.finished { opacity: .75; }
  .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .apt { font-size: 22px; font-weight: 700; }
  .badge { margin-left: auto; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 10px;
    background: var(--ok-bg); color: var(--ok-fg); }
  .urgent .badge { background: var(--info-bg); color: var(--info-fg); }
  .changed .badge { background: var(--chg-bg); color: var(--chg-fg); }
  .times { display: flex; gap: 16px; margin-top: 8px; font-size: 14px; }
  .times b { font-size: 16px; }
  .ivan { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: var(--chg-bg); color: var(--chg-fg); }
  .guest { margin-top: 10px; }
  .guest .lbl { font-size: 12px; color: var(--hint); }
  .guest .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .guest a { color: var(--link); text-decoration: none; white-space: nowrap; }
  .steps { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 4px; }
  .step { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .step:last-child { border-bottom: 0; }
  .num { flex: 0 0 24px; height: 24px; border-radius: 12px; background: var(--bg2); color: var(--hint);
    font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .num.ok { background: var(--green); color: #fff; }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 600; }
  .muted { color: var(--hint); font-size: 13px; }
  .warn { margin-top: 6px; padding: 6px 8px; border-radius: 8px; background: var(--bad-bg); color: var(--bad-fg); font-size: 13px; }
  .note { margin-top: 6px; font-size: 13px; color: var(--chg-fg); }
  .btn { display: block; width: 100%; margin-top: 8px; border: 0; border-radius: 10px; padding: 11px;
    font-size: 15px; font-weight: 600; background: var(--btn); color: var(--btn-text); }
  .btn.sec { background: var(--bg2); color: var(--text); }
  .btn:disabled { opacity: .4; }
  .link { border: 0; background: none; color: var(--link); padding: 4px 0; font-size: 14px; }
  .inline { display: flex; gap: 6px; margin-top: 8px; align-items: stretch; }
  .inline .btn { width: auto; margin: 0; padding: 0 14px; }
  input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg2); border: 0;
    border-radius: 10px; padding: 10px; }
  input[type=time], input[type=date] { min-height: 42px; -webkit-appearance: none; appearance: none; min-width: 0;
    display: block; text-align: left; }
  input[type=time]::-webkit-date-and-time-value, input[type=date]::-webkit-date-and-time-value { text-align: left; }
  input::placeholder, textarea::placeholder { color: var(--hint); }
  .inline input[type=time] { flex: 0 0 120px; width: 120px; }
  .inline label input[type=time] { width: 100%; flex: none; }
  textarea { min-height: 64px; resize: vertical; }
  .buy, .rem { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; gap: 8px; }
  .x { border: 0; background: none; color: var(--red); font-size: 18px; padding: 0 4px; }
  .form { margin-top: 8px; display: grid; gap: 8px; }
  .file { font-size: 14px; }
  .empty { text-align: center; color: var(--hint); padding: 16px 0; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: 16px; padding: 12px 14px; border-radius: 12px;
    background: var(--toast); color: #fff; font-size: 14px; display: none; z-index: 10; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  #toast.err { background: var(--red); }

  /* режим Ивана */
  /* нижняя безопасная зона: от iOS (env) или от Telegram (--tg-safe-area-inset-bottom), не меньше 14px */
  :root { --safe-b: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px), 14px); }
  body.owner main { padding-bottom: calc(96px + var(--safe-b)); }
  body.owner #toast { bottom: calc(84px + var(--safe-b)); }
  /* меню — плавающая панель с отступами, чтобы не уходить в скруглённые углы экрана */
  #tabs { display: none; position: fixed; left: 12px; right: 12px; bottom: var(--safe-b); z-index: 6;
    background: var(--bg); border: 1px solid var(--line); border-radius: 22px; padding: 6px 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  body.owner #tabs { display: flex; }
  #tabs button { flex: 1; border: 0; background: none; color: var(--hint); font-size: 11px; padding: 4px 0;
    display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #tabs button.on { color: var(--btn); font-weight: 600; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .seg button { border: 0; background: var(--bg); color: var(--text); border-radius: 16px; padding: 6px 12px; font-size: 14px; }
  .seg button.on { background: var(--btn); color: var(--btn-text); }
  .kv { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }
  .kv .muted { font-size: 14px; }
  .chip-s { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--bg2); }
  .st-ok { background: var(--ok-bg); color: var(--ok-fg); } .st-warn { background: var(--chg-bg); color: var(--chg-fg); }
  .st-off { background: var(--bg2); color: var(--hint); } .st-bad { background: var(--bad-bg); color: var(--bad-fg); }
  .bk { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .bk:last-child { border-bottom: 0; }
  .bk .r1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bk .r2, .bk .r3 { font-size: 14px; margin-top: 2px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .big { font-size: 30px; font-weight: 700; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0; }
  .nums div { background: var(--bg2); border-radius: 10px; padding: 8px; }
  .nums b { display: block; font-size: 16px; }
  .nums small { color: var(--hint); font-size: 12px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
  table.t td, table.t th { padding: 5px 4px; text-align: right; border-top: 1px solid var(--line); }
  table.t td:first-child, table.t th:first-child { text-align: left; }
  table.t th { color: var(--hint); font-weight: 500; font-size: 12px; }
  .stat { font-size: 14px; margin-top: 4px; }
  .rcpt { border: 0; background: var(--bg2); color: var(--link); border-radius: 8px; padding: 4px 8px; font-size: 13px; margin: 4px 4px 0 0; }
  select { width: 100%; font: inherit; color: var(--text); background: var(--bg2); border: 0; border-radius: 10px; padding: 10px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .grid2 > * { min-width: 0; }
  label.f { font-size: 12px; color: var(--hint); display: block; min-width: 0; }
  details summary { cursor: pointer; }
  label.f input, label.f select, label.f textarea { margin-top: 3px; }

  /* ================= Liquid Glass (Apple) =================
     Стекло — только функциональный слой: нижнее меню, шапка при прокрутке, всплывающие сообщения.
     Карточки и списки — плотные, чтобы текст читался. Под стеклом — мягкий цветной фон. */
  :root {
    --radius: 22px;
    --glass-fill: rgba(255,255,255,.7); --glass-border: rgba(255,255,255,.75); --glass-hi: rgba(255,255,255,.9);
    --glass-shade: rgba(0,0,0,.06); --glass-shadow: 0 8px 30px rgba(20,30,60,.12);
    --glass-blur: blur(28px) saturate(1.6);
    --card-shadow: 0 1px 2px rgba(20,30,60,.04), 0 6px 18px rgba(20,30,60,.06);
    --accent-soft: rgba(59,130,246,.14);
    --orb1: rgba(59,130,246,.20); --orb2: rgba(46,160,90,.14); --orb3: rgba(232,137,28,.10);
  }
  :root[data-theme="dark"] {
    --glass-fill: rgba(30,32,40,.74); --glass-border: rgba(255,255,255,.14); --glass-hi: rgba(255,255,255,.22);
    --glass-shade: rgba(0,0,0,.35); --glass-shadow: 0 10px 36px rgba(0,0,0,.55);
    --card-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    --accent-soft: rgba(74,140,255,.18);
    --orb1: rgba(74,140,255,.18); --orb2: rgba(63,191,111,.10); --orb3: rgba(240,160,75,.07);
  }
  body { font-size: 16px; -webkit-font-smoothing: antialiased; }
  #bgfx { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(70% 45% at 0% 25%, var(--orb1), transparent 70%),
                radial-gradient(60% 40% at 100% 55%, var(--orb2), transparent 70%),
                radial-gradient(70% 45% at 30% 100%, var(--orb3), transparent 70%); }

  .glass, #tabs, #toast, header.scrolled {
    background: var(--glass-fill);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  }
  #tabs, #toast { isolation: isolate; border: .5px solid var(--glass-border);
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-shade); }
  /* блик по краю стекла */
  #tabs::before, #toast::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(135deg, var(--glass-hi), transparent 40%, transparent 65%, var(--glass-border));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }

  /* шапка: прозрачная, при прокрутке — стекло */
  header { background: transparent; padding-top: calc(10px + var(--tg-content-safe-area-inset-top, 0px));
    transition: background .25s, box-shadow .25s; }
  header.scrolled { box-shadow: 0 .5px 0 var(--glass-border); }
  header h1 { font-size: 28px; letter-spacing: -.02em; }
  header button { font-size: 16px; min-height: 44px; }

  /* нижнее меню — стеклянная капсула */
  #tabs { left: 12px; right: 12px; bottom: var(--safe-b); border-radius: 28px; padding: 6px; }
  #tabs button { min-height: 48px; border-radius: 22px; gap: 1px; transition: transform .15s, background .2s; }
  #tabs button.on { color: var(--btn); background: var(--accent-soft); }

  /* сообщения — стекло, текст цвета темы */
  #toast { color: var(--text); border-radius: 18px; padding: 14px 16px; font-weight: 500; }
  #toast.err { background: var(--glass-fill); color: var(--red); }

  /* контент — плотные карточки */
  .box, .card { border-radius: var(--radius); box-shadow: var(--card-shadow); }
  .box { padding: 16px; margin-bottom: 12px; }
  .card { padding: 16px 16px 16px 20px; margin-bottom: 12px; border-left: 0; position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px;
    border-radius: 0 4px 4px 0; background: var(--green); }
  .card.urgent::before { background: var(--blue); }
  .card.changed::before { background: var(--orange); }
  .apt { font-size: 26px; letter-spacing: -.02em; }
  .badge, .chip-s { border-radius: 999px; padding: 4px 10px; }
  .ivan, .warn { border-radius: 12px; padding: 10px 12px; }
  h2 { margin: 20px 6px 10px; }

  /* календарь */
  .cal-head b { font-size: 18px; }
  .cal-head button { width: 44px; height: 36px; border-radius: 12px; }
  .d { min-height: 50px; border-radius: 14px; transition: transform .15s; }
  .d.sel { box-shadow: 0 6px 16px rgba(59,130,246,.35); }

  /* кнопки и поля: 44px+, нажатие — лёгкое сжатие */
  .btn { min-height: 50px; border-radius: 14px; font-size: 16px; transition: transform .15s, opacity .15s; }
  .inline .btn { min-height: 44px; }
  .btn.sec { background: var(--bg2); }
  .btn:active, .seg button:active, .d:active, #tabs button:active, .rcpt:active, .cal-head button:active { transform: scale(.97); }
  .btn:active { opacity: .9; }
  input, textarea, select { border-radius: 12px; padding: 12px; min-height: 44px; }
  .seg button { min-height: 38px; padding: 8px 14px; border-radius: 999px; background: var(--bg); box-shadow: var(--card-shadow); }
  .nums div, .rcpt { border-radius: 12px; }
  .num { flex-basis: 26px; height: 26px; border-radius: 13px; }

  /* без размытия или при повышенном контрасте — плотная заливка */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    #tabs, #toast, header.scrolled { background: var(--bg); }
  }
  @media (prefers-contrast: more) {
    #tabs, #toast, header.scrolled { background: var(--bg); border-color: var(--hint); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="bgfx"></div>
<header><h1>Уборки</h1><div class="right"><span id="sync"></span><button id="refresh">Обновить</button></div></header>
<main id="list"><p class="empty">Загрузка…</p></main>
<nav id="tabs"></nav>
<div id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
// адрес скрипта: из ссылки (?api=…), а если его там нет — этот (для кнопки «Открыть» в профиле бота)
const API_DEFAULT = 'https://script.google.com/macros/s/AKfycbwN1T1SNz2RzLm78sPtLvoII0GsWTnXn5csP1zV5c478cs16OLkX_9iCMtr4XCz6ze8/exec';
const API = new URLSearchParams(location.search).get('api') || API_DEFAULT;
let state = null;                     // данные с сервера
const ui = { open: {}, month: '', sel: '', tab: 'clean', asMaid: false, bkView: 'future', bkApt: '' };
const ICON = {
  clean: '<path d="M3 11l9-7 9 7v8a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2z"/>',
  bookings: '<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  money: '<rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 10h18M15.5 15h2"/>',
  income: '<path d="M5 20v-6M12 20V9M19 20V4"/>',
  more: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
};
const TABS = [['clean', 'Уборки'], ['bookings', 'Брони'], ['money', 'Деньги'], ['income', 'Доходы'], ['more', 'Ещё']];
const isOwner = () => state && state.role === 'owner';
const ownerView = () => isOwner() && !ui.asMaid;
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь',
  'Ноябрь', 'Декабрь'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября',
  'ноября', 'декабря'];
const WEEKDAYS = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];

function applyTheme() {
  const dark = tg && tg.colorScheme ? tg.colorScheme === 'dark'
    : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const page = dark ? '#121318' : '#f2f3f7', bar = dark ? '#1d1f26' : '#ffffff';
  try { tg.setHeaderColor(page); } catch (e) {}
  try { tg.setBackgroundColor(page); } catch (e) {}
  try { tg.setBottomBarColor(page); } catch (e) {}
}
applyTheme();
if (tg) {
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes(); } catch (e) {} // прокрутка не закрывает приложение
  try { tg.onEvent('themeChanged', applyTheme); } catch (e) {}
}
// шапка становится стеклом, когда под ней прокручивается контент
addEventListener('scroll', () => document.querySelector('header').classList.toggle('scrolled', scrollY > 4), { passive: true });
function tap() { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }
function pick() { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }

/* ---------- мелочи ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = isErr ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, isErr ? 5000 : 2200);
}
function haptic(kind) { try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }
function confirmBox(text) {
  return new Promise(res => {
    if (tg && tg.showConfirm) { try { tg.showConfirm(text, ok => res(!!ok)); return; } catch (e) {} }
    res(window.confirm(text));
  });
}
function setSync(text) { document.getElementById('sync').textContent = text || ''; }
function nowShort() {
  const d = new Date(), p = n => ('0' + n).slice(-2);
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function hm(s) { const m = String(s || '').match(/(\d{1,2})[:.](\d{2})\s*$/); return m ? +m[1] * 60 + +m[2] : null; }
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dayTitle(iso) {
  const d = new Date(iso + 'T12:00:00Z');
  return WEEKDAYS[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + MONTHS_GEN[d.getUTCMonth()];
}
function phoneLink(p) {
  if (!p) return '';
  return '<a href="tel:' + esc(String(p).replace(/[^\d+]/g, '')) + '">📞 ' + esc(p) + '</a>';
}
function guestsWord(n) {
  n = Number(n); if (!n) return '';
  const m10 = n % 10, m100 = n % 100;
  const w = m10 === 1 && m100 !== 11 ? 'гость' : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? 'гостя' : 'гостей';
  return n + ' ' + w;
}
function money(n) { return String(Math.round(Number(n) * 100) / 100).replace('.', ','); }
function until() { return state.until || addDays(state.today, 31); }
function itemTimes(tc) {
  const pick = re => { const m = String(tc || '').match(re); return m ? ('0' + m[1]).slice(-2) + ':' + m[2] : ''; };
  return { checkoutTime: pick(/выезд\D{0,20}?(\d{1,2})[:.](\d{2})/i) || state.checkout,
    checkinTime: pick(/заезд\D{0,20}?(\d{1,2})[:.](\d{2})/i) || state.checkin };
}
function rub(n) { return (Math.round(Number(n) || 0)).toLocaleString('ru-RU') + ' ₽'; }
function ddmmyy(iso) { return iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) : ''; }
function wd(iso) { return ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'][new Date(iso + 'T12:00:00Z').getUTCDay()]; }
function findItem(key) { return state && state.items.find(i => i.key === key); }
/** то же правило, что у сервера: '' — успевает, 'tight' — меньше часа до заезда, 'late' — позже заселения */
function arrivalCheck(it) {
  if (!it.urgent || !it.maidTime) return '';
  const a = hm(it.maidTime), c = hm(it.checkinTime);
  if (a === null || c === null) return '';
  if (a >= c) return 'late';
  return c - a < 60 ? 'tight' : '';
}

/* ---------- связь с сервером ---------- */
async function call(action, extra) {
  if (!API) throw new Error('Откройте график через бота в Telegram');
  const body = Object.assign({ action: action, initData: tg ? tg.initData : '' }, extra || {});
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Ошибка');
  return j.data;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
/** Если таблица занята обновлением, сервер ничего не сохранил — можно спокойно повторить. */
async function withRetry(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      if (i < 4 && /обновляется/i.test(e.message)) { setSync('Таблица обновляется, жду…'); await sleep(8000); continue; }
      throw e;
    }
  }
}

// Кнопки срабатывают сразу: экран меняется, запрос уходит в фоне, по очереди.
const pending = {};
let inflight = 0, chain = Promise.resolve(), savedTimer = null;

function send(action, extra, key, okMsg) {
  inflight++;
  if (key) pending[key] = (pending[key] || 0) + 1;
  setSync('Сохраняю…');
  render();
  const p = chain.then(() => withRetry(() => call(action, extra))).then(data => {
    inflight--; if (key) pending[key]--;
    if (data.owner && !pending.own) state.owner = data.owner;
    if (data.items) { if (!inflight) state = Object.assign(data, { owner: data.owner || state.owner }); }
    else if (data.item && !pending[data.item.key]) {
      const i = state.items.findIndex(x => x.key === data.item.key);
      if (i >= 0) state.items[i] = data.item;
    } else if (data.reminders && !pending.rem) state.reminders = data.reminders;
    render();
    if (!inflight) {
      setSync('Сохранено ✓');
      clearTimeout(savedTimer); savedTimer = setTimeout(() => { if (!inflight) setSync(''); }, 2000);
    }
    if (okMsg) toast(okMsg);
    return data;
  }, err => {
    inflight--; if (key) pending[key]--;
    setSync('');
    toast('Не сохранилось: ' + err.message, true); haptic('error');
    reload(); // вернуть экран к тому, что реально в таблице
    throw err;
  });
  chain = p.catch(() => {});
  return p.catch(() => null); // null = не сохранилось (ошибка уже показана)
}

let loading = false;
async function reload() {
  if (loading) return;
  loading = true;
  if (!inflight) setSync('Загрузка…');
  try {
    const data = await withRetry(() => call('list'));
    if (!inflight) {
      state = Object.assign(data, { owner: state && state.owner });
      if (!ui.sel) { ui.sel = state.today; ui.month = state.today.slice(0, 7); }
      render(); setSync('');
      if (isOwner() && ui.tab !== 'clean') loadOwner();
    }
  } catch (e) {
    setSync(''); toast(e.message, true);
    if (!state) document.getElementById('list').innerHTML = '<p class="empty">' + esc(e.message) + '</p>';
  } finally { loading = false; }
}

async function loadOwner() {
  if (ui.ownerLoading) return;
  ui.ownerLoading = true; setSync('Загрузка…'); render();
  try {
    const d = await withRetry(() => call('owner'));
    if (!pending.own) state.owner = d.owner;
    setSync('');
  } catch (e) { setSync(''); toast(e.message, true); }
  finally { ui.ownerLoading = false; render(); }
}

/* ---------- календарь ---------- */
function calendar() {
  const [y, m] = ui.month.split('-').map(Number);
  const startDow = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7; // пн = 0
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const byDate = {}, remDates = {};
  state.items.forEach(it => { (byDate[it.date] = byDate[it.date] || []).push(it); });
  (state.reminders || []).forEach(r => { remDates[r.date] = true; });
  let h = '<div class="box"><div class="cal-head"><button data-act="month" data-step="-1">‹</button><b>' +
    MONTHS[m - 1] + ' ' + y + '</b><button data-act="month" data-step="1">›</button></div><div class="grid">';
  ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(w => { h += '<div class="wd">' + w + '</div>'; });
  for (let i = 0; i < startDow; i++) h += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const iso = ui.month + '-' + ('0' + d).slice(-2);
    const na = iso > until();
    const cls = ['d', iso < state.today ? 'past' : '', na ? 'na' : '', iso === state.today ? 'today' : '',
      iso === ui.sel ? 'sel' : ''].join(' ');
    const dots = (byDate[iso] || []).map(it =>
      '<i class="dot ' + (it.done ? 'done' : it.changed ? 'changed' : it.urgent ? 'urgent' : '') + '"></i>').join('');
    h += '<button class="' + cls + '" data-act="day" data-date="' + iso + '"><span class="n">' + d + '</span>' +
      '<span class="dots">' + (na ? '' : dots + (remDates[iso] ? '<span class="bell">🔔</span>' : '')) + '</span></button>';
  }
  h += '</div><div class="legend"><span><i class="dot urgent"></i>заезд в тот же день</span>' +
    '<span><i class="dot"></i>без заезда</span><span><i class="dot changed"></i>Иван изменил время</span>' +
    '<span><i class="dot done"></i>готово</span><span>🔔 напоминание</span></div></div>';
  return h;
}

function render() {
  const list = document.getElementById('list');
  if (!state) return;
  renderTabs();
  if (isOwner() && ui.tab !== 'clean') {
    const o = state.owner;
    let h = !o ? '<p class="empty">Загрузка…</p>' : ui.tab === 'bookings' ? tabBookings(o) : ui.tab === 'money' ? tabMoney(o)
      : ui.tab === 'income' ? tabIncome(o) : tabMore(o);

    const u = until();
    h += '<div class="box empty">Пока не доступно<br><span class="muted">График открыт до ' +
      esc(u.slice(8, 10) + '.' + u.slice(5, 7) + '.' + u.slice(0, 4)) + '</span></div>';

      '">Следующая: ' + esc(next.day) + ' · ' + esc(next.apartment) + '</button>' : '') + '</div>';
  }

  keepInputs(list, () => { list.innerHTML = h; });
}

/** Не теряем то, что печатают или выбрали, пока приходят ответы сервера. */
function keepInputs(list, draw) {
  const typed = {}, files = {};
  list.querySelectorAll('input:not([type=file]), textarea, select').forEach(el => { if (el.dataset.dirty) typed[el.id] = el.value; });
  list.querySelectorAll('input[type=file]').forEach(el => { files[el.id] = el; });
  const focusId = document.activeElement && document.activeElement.id;
  draw();
  Object.keys(typed).forEach(id => { const el = document.getElementById(id); if (el) { el.value = typed[id]; el.dataset.dirty = '1'; } });
  Object.keys(files).forEach(id => { const el = document.getElementById(id); if (el) el.replaceWith(files[id]); });
  if (focusId) { const el = document.getElementById(focusId); if (el && el.focus) el.focus(); }
}

/** Сжимаем фото чека до ~1600 px, чтобы быстро загружалось. */
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.75).split(',')[1]);
    };
    img.onerror = () => reject(new Error('Не удалось открыть фото'));
    img.src = URL.createObjectURL(file);
  });
}

async function ownerClick(a, b) {
  const o = state.owner;
  if (a === 'openUrl') { const u = b.dataset.url; if (tg && tg.openLink) tg.openLink(u); else window.open(u, '_blank'); return true; }
  if (a === 'ownerNote') {
    const key = b.dataset.key, it = findItem(key);
    it.timeChange = v('tc-' + key); it.note = v('nt-' + key);
    it.changed = !!it.timeChange; it.fromIvan = [it.timeChange, it.note].filter(Boolean).join(' · ');
    Object.assign(it, itemTimes(it.timeChange));
    undirty('tc-' + key); undirty('nt-' + key); haptic('success');
    send('ownerNote', { key: key, timeChange: it.timeChange, note: it.note }, key,
      it.timeChange || it.note ? 'Сохранено, горничная получит сообщение' : 'Сохранено');
    return true;
  }
  if (a === 'ownVideo') { send('ownVideo', { key: b.dataset.key }, b.dataset.key, 'Видео придёт в чат с ботом'); return true; }
  if (a === 'asMaid') { ui.asMaid = !ui.asMaid; ui.tab = 'clean'; render(); return true; }
  if (!o) return false;
  if (a === 'bkView') { ui.bkView = b.dataset.v; render(); return true; }
  if (a === 'bkApt') { ui.bkApt = b.dataset.v; render(); return true; }
  if (a === 'bkForm') { ui.open.bkForm = !ui.open.bkForm; render(); return true; }
  if (a === 'bkOpen') { ui.open['bk|' + b.dataset.id] = true; render(); return true; }
  if (a === 'bkAdd') {
    const req = { platform: v('nb-platform'), apartment: v('nb-apt'), checkIn: v('nb-in'), checkOut: v('nb-out'),
      guests: v('nb-guests'), income: v('nb-income'), guest: v('nb-guest'), phone: v('nb-phone'), comment: v('nb-comment') };
    if (!req.checkIn || !req.checkOut || req.checkOut <= req.checkIn) { toast('Проверьте даты заезда и выезда', true); return true; }
    ui.open.bkForm = false; undirty('nb-');
    o.bookings.push({ id: 'tmp' + Date.now(), platform: req.platform, apartment: req.apartment, checkIn: req.checkIn, checkOut: req.checkOut,
      nights: Math.round((new Date(req.checkOut) - new Date(req.checkIn)) / 864e5), guests: req.guests, status: 'сохраняю…',
      guest: req.guest, phone: req.phone, income: req.income === '' ? '' : Number(req.income.replace(',', '.')), comment: req.comment, editable: false });
    o.bookings.sort((x, y) => (x.checkIn < y.checkIn ? -1 : 1));
    haptic('success');
    send('bkAdd', req, 'own', 'Бронь добавлена — уборка появится в графике');
    return true;
  }
  if (a === 'bkSave' || a === 'bkCancel') {
    const id = b.dataset.id, bk = o.bookings.find(x => x.id === id);
    if (a === 'bkCancel' && !(await confirmBox('Отметить бронь как отменённую? Уборка исчезнет из графика.'))) return true;
    const req = { id: id };
    if (a === 'bkSave') {
      if (byId('be-income-' + id)) { req.income = v('be-income-' + id); bk.income = req.income === '' ? '' : Number(req.income.replace(',', '.')); }
      req.comment = v('be-comment-' + id); bk.comment = req.comment;
    } else { req.status = 'отменена'; bk.status = 'отменена'; }
    ui.open['bk|' + id] = false; undirty('be-'); haptic('success');
    send('bkEdit', req, 'own', 'Сохранено');
    return true;
  }
  if (a === 'payOne' || a === 'payAll') {
    const m = o.money;
    const keys = a === 'payAll' ? m.unpaid.map(r => r.key) : [b.dataset.key];
    const sum = m.unpaid.filter(r => keys.indexOf(r.key) >= 0).reduce((s, r) => s + r.sum, 0);
    if (!(await confirmBox('Отметить оплату ' + money(sum) + ' BYN? Горничная получит сообщение.'))) return true;
    m.unpaid = m.unpaid.filter(r => keys.indexOf(r.key) < 0);
    m.total = Math.round((m.total - sum) * 100) / 100;
    m.fees = Math.round(m.unpaid.reduce((s, r) => s + r.fee, 0) * 100) / 100;
    m.buys = Math.round(m.unpaid.reduce((s, r) => s + r.buy, 0) * 100) / 100;
    haptic('success');
    send('pay', { keys: keys }, 'own', 'Оплата отмечена');
    return true;
  }
  if (a === 'saveSettings') {
    const req = { checkout: v('st-checkout'), checkin: v('st-checkin'), cleanFee: v('st-fee').replace(',', '.'), rate: v('st-rate').replace(',', '.') };
    Object.assign(o.settings, { checkout: req.checkout, checkin: req.checkin, cleanFee: Number(req.cleanFee), rate: Number(req.rate) });
    undirty('st-'); haptic('success');
    send('setSettings', req, 'own', 'Настройки сохранены');
    return true;
  }
  if (a === 'syncNow') {
    setSync('Обновляю брони…');
    send('sync', {}, 'own', 'Брони обновлены');
    return true;
  }
  return false;
}

listEl.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || !state) return;
  const key = b.dataset.key, a = b.dataset.act, it = key ? findItem(key) : null;
  const field = id => document.getElementById(id + '-' + (key || 'x'));
  const val = id => { const el = field(id); return el ? el.value.trim() : ''; };
  const clean = id => { const el = field(id); if (el) { delete el.dataset.dirty; el.value = ''; } };
  const ok = () => haptic('success');
  if (a !== 'day' && a !== 'month') tap();
  if (isOwner() && await ownerClick(a, b)) return;

  if (a === 'month') {
    const [y, m] = ui.month.split('-').map(Number);
    const d = new Date(Date.UTC(y, m - 1 + Number(b.dataset.step), 1));
    ui.month = d.toISOString().slice(0, 7);
    return render();
  }
  if (a === 'day') { pick(); ui.sel = b.dataset.date; ui.month = ui.sel.slice(0, 7); return render(); }

  if (a === 'time') {
    const t = val('tm');
    const el = field('tm'); if (el) delete el.dataset.dirty;
    it.maidTime = t; ok();
    const w = arrivalCheck(it);
    return send('time', { key: key, time: t }, key,
      w ? 'Время сохранено. Иван предупредит гостей' : 'Время сохранено');
  }
  if (a === 'start') {
    if (!(await confirmBox('Вы в квартире и начинаете уборку?'))) return;
    it.started = nowShort(); ok();
    return send('start', { key: key }, key);
  }
  if (a === 'video') {
    // ждём ответ: бот должен знать, к какой уборке придёт видео, до того как приложение закроется
    toast('Секунду…');
    if (!(await send('video', { key: key }, key))) return;
    toast('Отправьте видео в чат бота');
    setTimeout(() => { if (tg) tg.close(); }, 700);
    return;
  }
  if (a === 'done') {
    if (!(await confirmBox('Квартира убрана, отправить отчёт Ивану?'))) return;
    it.done = nowShort(); ok();
    return send('done', { key: key }, key, 'Готово! Спасибо');
  }
  if (a === 'undo') {
    if (!(await confirmBox('Отменить отметку?'))) return;
    if (b.dataset.field === 'done') it.done = ''; else { it.started = ''; it.done = ''; }
    return send('undo', { key: key, field: b.dataset.field }, key);
  }
  if (a === 'comment') {
    const el = field('cm'); if (el) delete el.dataset.dirty;
    it.comment = val('cm'); ok();
    return send('comment', { key: key, text: it.comment }, key, 'Заметка сохранена');
  }
  if (a === 'buyToggle') { ui.open['buy|' + key] = !ui.open['buy|' + key]; return render(); }
  if (a === 'buySave') {
    const amount = val('ba').replace(',', '.');
    if (!(Number(amount) > 0)) return toast('Укажите сумму в BYN, например 12,50', true);
    const fileEl = field('bf');
    const file = fileEl && fileEl.files && fileEl.files[0];
    if (!file && !(await confirmBox('Сохранить без фото чека?'))) return;
    const what = val('bw');
    ui.open['buy|' + key] = false;
    it.purchases.push({ id: 'tmp' + Date.now(), amount: Number(amount), what: what, receipt: !!file, saving: true });
    ok(); render();
    let photo = '';
    try { if (file) photo = await compress(file); }
    catch (err) { it.purchases = it.purchases.filter(p => !p.saving); render(); return toast(err.message, true); }
    return send('purchase', { key: key, amount: amount, what: what, photo: photo }, key);
  }
  if (a === 'delBuy') {
    if (!(await confirmBox('Удалить эту покупку?'))) return;
    it.purchases = it.purchases.filter(p => p.id !== b.dataset.id); ok();
    return send('delPurchase', { id: b.dataset.id }, key);
  }
  if (a === 'remAdd') {
    const text = val('rt'), time = val('rtm');
    if (!text) return toast('Напишите текст напоминания', true);
    clean('rt'); clean('rtm');
    state.reminders = (state.reminders || []).concat([{ id: 'tmp' + Date.now(), date: ui.sel, time: time, text: text, saving: true }]);
    ok();
    return send('remAdd', { date: ui.sel, time: time, text: text }, 'rem', time ? 'Бот напомнит в ' + time : 'Добавлено');
  }
  if (a === 'remDel') {
    if (String(b.dataset.id).indexOf('tmp') === 0) return;
    state.reminders = state.reminders.filter(r => r.id !== b.dataset.id); ok();
    return send('remDel', { id: b.dataset.id }, 'rem');
  }
});

document.addEventListener('visibilitychange', () => { if (!document.hidden && state && !inflight) reload(); });

reload();
</script>
